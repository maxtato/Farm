// Allure en virage : plein régime dans l'axe, ralentissement franc au demi-tour, et
// entre les deux une courbe douce plutôt qu'une cassure. La même sert au manche et au
// pilote automatique, pour que les deux se comportent pareil.
function speedForTurn(diff){
  const k = .5 + .5*Math.cos(diff);          // 1 dans l'axe, 0 à l'opposé
  return .18 + .82*Math.pow(k, 1.3);
}
// et elle s'établit au lieu de sauter : sinon l'engin saccade à chaque coup de manche.
// Dissymétrique à dessein : il lève le pied franchement en entrant en courbe, et relance
// en douceur une fois revenu dans l'axe.
function easeGrip(v, target, dt){
  if (v.grip === undefined) v.grip = 1;
  v.grip += (target - v.grip)*Math.min(1, dt*(target < v.grip ? 8 : 3.5));
  return v.grip;
}

// conduite au manche, au clavier ou sur parcours : le même code pour l'engin d'attelage
// comme pour la benne, puisque les deux se pilotent maintenant.
function driveManual(v, dt){
  {
    const push = Math.max(0, (jmag - .12)/.88);                // zone morte au centre
    const turning = jmag > .12;
    // Le manche est lu à l'écran, pas dans le monde : il faut le tourner du lacet de la
    // caméra, sinon pousser à droite n'envoie plus l'engin à droite de l'écran dès qu'on
    // a pivoté la vue. Droite d'écran = (cos, -sin) au sol, haut d'écran = -(sin, cos).
    const cyw = Math.cos(YAW), snw = Math.sin(YAW);
    const wantH = turning ? Math.atan2(jx*cyw + jy*snw, -jx*snw + jy*cyw) : v.heading;
    // demi-tour au manche : il lève le pied le temps de pivoter, puis relance
    let d = wantH - v.heading;
    while(d >  Math.PI) d -= 6.28318;
    while(d < -Math.PI) d += 6.28318;
    // il lève le pied dès qu'il braque, et relance tout seul une fois dans l'axe du manche
    const grip = easeGrip(v, turning ? speedForTurn(d) : 1, dt);
    step(v, dt, wantH, push*MAXSPD*mudK*grip, turning);
  }
}
function step(v, dt, wantHeading, wantSpeed, turnable){
  if (turnable){
    let diff = wantHeading - v.heading;
    while(diff> Math.PI) diff -= 6.28318;
    while(diff<-Math.PI) diff += 6.28318;
    const rate = Math.min(TURNCAP, v.speed/RMIN + TURNFLOOR);  // dθ/dt = v/R, plus un pivot de base
    // la vitesse angulaire s'établit au lieu de sauter à son maximum : le virage s'amorce
    // et se referme en douceur, sans l'à-coup d'un braquage instantané
    const want = Math.max(-rate, Math.min(rate, diff/Math.max(dt,1e-4)));
    if (v.wRate === undefined) v.wRate = 0;
    v.wRate += (want - v.wRate)*Math.min(1, dt*8);
    let turn = v.wRate*dt;
    if (Math.abs(turn) > Math.abs(diff)) turn = diff;          // sans jamais dépasser la consigne
    v.heading += turn; v.turnRate = turn/Math.max(dt,1e-4);
    v.steerA += (Math.max(-.6,Math.min(.6,diff*1.4)) - v.steerA)*Math.min(1,dt*10);
  } else {
    v.steerA += (0 - v.steerA)*Math.min(1,dt*6);
    v.turnRate *= .9; v.wRate = (v.wRate || 0)*.9;
  }
  // Prime de ligne droite : l'élan se construit tant que l'engin tient son cap et se perd
  // dès qu'il braque. Quelques secondes de passage droit et il file près d'un tiers plus
  // vite ; le moindre coup de manche le ramène à son allure de travail.
  const tenu = turnable ? Math.max(0, 1 - Math.abs(v.turnRate)/1.1) : 1;
  const vise = wantSpeed > .5 ? tenu : 0;
  v.line += (vise - v.line)*Math.min(1, dt*(vise > v.line ? 1.5 : 5));
  v.speed += (wantSpeed*(1 + LINEK*v.line) - v.speed)*Math.min(1, dt*ACC);
  v.pos.x += Math.sin(v.heading)*v.speed*dt;
  v.pos.z += Math.cos(v.heading)*v.speed*dt;
  unstick(v);                                            // décor et autres engins : on ne traverse pas
  const d = v.g.userData;
  d.wheels.forEach(w => w.userData.spin.rotation.x += v.speed*dt/w.userData.r);
  (d.steer||[]).forEach(s => s.w.rotation.y = v.steerA*s.k);
  (d.spinners||[]).forEach(s => {
    if (s.spin) s.spin.rotation.x += dt*(s.rate + v.speed*.6);
    else s.userData.spin.rotation.x += v.speed*dt/s.userData.r;
  });
  if (d.hitch){
    let rel = d.hitch.rotation.y;
    rel += (v.speed/3.4)*Math.sin(-rel)*dt - (v.heading - (v.lastH===undefined?v.heading:v.lastH));
    d.hitch.rotation.y = Math.max(-.95, Math.min(.95, rel));   // butée : au-delà l'outil rentrerait dans les roues
  }
  v.lastH = v.heading;
  v.lastDt = dt;
  v.trk += v.speed*dt;
  if (v.trk > .34 && v.speed > .3){
    v.trk = 0;
    const cs = Math.cos(v.heading), sn = Math.sin(v.heading);
    for(const side of [-1,1])
      TRACKS.add(v.pos.x + cs*side*1.2 - sn*.6, v.pos.z - sn*side*1.2 - cs*.6, v.heading, .58);
  }
  // --- suspensions très molles : plus de saut sec, la caisse flotte sur ses ressorts ---
  const sf = Math.min(1, v.speed/5);
  v.bob += dt*(1.6 + v.speed*.85);
  v.wph += (v.speed/1.15)*dt;                                // phase de rotation des roues
  // L'irrégularité ne vient que du sol travaillé : sur l'herbe l'engin roule droit,
  // et il se met à sautiller dès qu'il monte sur la terre.
  const onSoil = Math.min(1, Math.max(0, parcelY(v.pos.x, v.pos.z)/(LIP*.6)));
  v.soil = (v.soil === undefined ? onSoil : v.soil + (onSoil - v.soil)*Math.min(1, dt*6));
  const warp = Math.sin(v.wph)*1.25 + Math.sin(v.wph*.5+1.1)*.7;   // roues voilées sur la terre
  const bump = ((Math.sin(v.bob*2.1) + Math.sin(v.bob*3.37)*.55 + Math.sin(v.bob*5.1)*.3)*2.4
                + warp*2.6)*sf*v.soil;
  const K = 24, D = 5.4;                                     // ~0,78 Hz, amortissement 0,55
  v.susV += (-K*v.sus - D*v.susV + bump)*dt;
  v.sus = Math.max(-.19, Math.min(.19, v.sus + v.susV*dt));
  const acc = (v.speed - v.lastS)/Math.max(dt,1e-4); v.lastS = v.speed;
  v.pitV += (-K*v.pit - D*v.pitV - acc*.05 + bump*.06)*dt;   // plongée au freinage, cabrage à l'accél.
  v.pit = Math.max(-.09, Math.min(.09, v.pit + v.pitV*dt));
  // Le penchant en virage, franchement plus marqué : la caisse s'incline vers l'extérieur
  // de la courbe, d'autant plus qu'on va vite, et revient en oscillant une fois redressé.
  v.rolV += (-K*v.rol - D*v.rolV - v.turnRate*v.speed*.155
             + Math.sin(v.wph + 2.1)*1.3*sf*v.soil)*dt;
  v.rol = Math.max(-.26, Math.min(.26, v.rol + v.rolV*dt));
  // Carrosserie molle : elle se tasse et s'étire en hauteur, entretenue par les cahots, par
  // les reprises et par un rebond continu tant qu'elle roule. Le volume se conserve — ce qui
  // s'écrase en hauteur s'élargit d'autant, sinon l'engin maigrit au lieu de rebondir.
  // Le ressort n'encaisse que les à-coups : cahots et reprises. Le balancement d'une caisse
  // molle, lui, est appliqué directement — passé par le ressort il était excité bien
  // au-dessus de sa fréquence propre et n'en sortait qu'un pour cent.
  // Mesuré sur la vidéo, sur un passage droit : la caisse varie de treize pour cent en
  // hauteur crête à crête, à 2,5 Hz, tandis que sa largeur ne bouge pas — deux et demi pour
  // cent, soit le bruit de mesure. Le bas reste posé, c'est le toit qui monte et redescend.
  // On s'aligne : plus aucune compensation de largeur, et une amplitude du même ordre.
  const K3 = 52, D3 = 5.8;                                   // ~1,15 Hz, bien élastique
  v.sqV += (-K3*v.sq - D3*v.sqV - v.susV*1.5 - acc*.11)*dt;
  v.sq = Math.max(-.045, Math.min(.045, v.sq + v.sqV*dt));
  v.wob = Math.sin(v.bob*1.5)*.05*sf;                        // ~2,5 Hz à pleine allure
  // la terre est en surépaisseur : l'engin y monte, et se cabre sur la rampe du bord
  const sn2 = Math.sin(v.heading), cs2 = Math.cos(v.heading);
  const gy = parcelY(v.pos.x, v.pos.z);
  const fy = parcelY(v.pos.x + sn2*1.8, v.pos.z + cs2*1.8);
  const by = parcelY(v.pos.x - sn2*1.8, v.pos.z - cs2*1.8);
  if (v.gy === undefined) v.gy = gy;
  v.gy += (gy - v.gy)*Math.min(1, dt*10);
  v.slope = (v.slope || 0) + (Math.atan2(by - fy, 3.6) - (v.slope || 0))*Math.min(1, dt*8);
  v.h.position.set(v.pos.x, v.gy, v.pos.z);
  v.h.rotation.y = v.heading;
  v.g.position.y = v.sus;
  v.g.rotation.set(v.pit + v.slope, 0, v.rol);
  // en hauteur seulement : la caisse ne s'élargit pas, elle se soulève et se rabaisse
  v.g.scale.set(1, 1 + v.sq + (v.wob||0), 1);
  // Deux rails posés juste sous l'arrière, dans la trace même de l'engin, dès que l'élan
  // de ligne droite est pris. Ils se recouvrent assez pour faire une ligne continue, et
  // s'effacent en un quart de seconde là où ils ont été posés.
  if (v.line > .3 && v.speed > 4){
    v.strk += dt*(9 + 9*v.line);
    while (v.strk >= 1){
      v.strk -= 1;
      const len = 1.5 + Math.random()*.8 + v.line*1.1;
      const rec = 2.3 + Math.random()*.4;
      popStreak(v.pos.x, v.pos.z, v.heading, -(.7 + Math.random()*.14), rec, len, v.line);
      popStreak(v.pos.x, v.pos.z, v.heading,  (.7 + Math.random()*.14), rec, len, v.line);
    }
  } else v.strk = 0;
  const br = v.g.userData.brakes;
  if (br){                                                   // feux stop au ralentissement
    const on = (wantSpeed < v.speed - .25) ? 1 : .18;
    br.forEach(m => m.material.emissive.setRGB(on, on*.06, on*.04));
  }
}
// valeurs d'usine, puis valeurs courantes modulées par les améliorations et par la météo
const MAXSPD0 = 7.6, RMIN0 = 2.0;   // vitesse de base ; rayon de braquage mini
// Le braquage tenait de l'engin de chantier : plafonné à 1,9 rad/s sur un rayon de 2,8 m,
// il fallait un virage large pour se retourner. On resserre le rayon, on relève le plafond,
// et on ajoute un pivot minimal pour que l'engin réponde au manche même en roulant doucement.
// Un cran plus rond encore : plafond et pivot de base abaissés, rayon mini élargi, et la
// vitesse angulaire met un peu plus longtemps à s'établir. Le demi-tour reste court, mais
// l'entrée en courbe ne casse plus la trajectoire.
const TURNCAP = 4.3, TURNFLOOR = 1.7;
const LINEK = .48;                  // jusqu'à +48 % d'allure sur un long passage droit
let MAXSPD = MAXSPD0, RMIN = RMIN0, ACC = 10, GROWK = 1, PRICEK = 1, mudK = 1;
// Le décalage de l'outil, ramené dans le repère du monde : viser un point avec l'outil,
// c'est viser, avec le tracteur, ce même point reculé de la longueur de l'attelage.
function outilXZ(v, out){
  const o = v.trav || 0;
  out.x = v.pos.x + Math.sin(v.heading)*o;
  out.z = v.pos.z + Math.cos(v.heading)*o;
  return out;
}
const _vise = { x:0, z:0 }, _out = { x:0, z:0 }, _out2 = { x:0, z:0 };
function driveTo(v, target, dt, stop, large, outil){
  const vrai = target;
  const dec = outil ? (v.trav || 0) : 0;
  if (dec){
    // L'outil traîne exactement derrière l'engin : viser un point avec lui, c'est viser
    // ce point reculé de la longueur de l'attelage, dans l'axe de l'engin. On dépasse
    // donc le point de cette longueur (outil porté à l'arrière) ou on s'arrête d'autant
    // avant (barre de coupe), et la consigne reste devant pendant tout le dépassement.
    _vise.x = target.x - Math.sin(v.heading)*dec;
    _vise.z = target.z - Math.cos(v.heading)*dec;
    target = _vise;
  }
  const dbut = Math.hypot(target.x-v.pos.x, target.z-v.pos.z);
  // `large` : on regarde aussi au-delà du point visé. Sur un tracé les points se suivent de
  // près, et se borner à eux revenait à rouler les yeux fermés.
  const portee = large ? Math.max(dbut, 14) : dbut;
  const want = dodge(v, Math.atan2(target.x-v.pos.x, target.z-v.pos.z), portee);
  let diff = want - v.heading;
  while(diff> Math.PI) diff -= 6.28318;
  while(diff<-Math.PI) diff += 6.28318;
  // en auto aussi il ralentit pour braquer, avec exactement la même courbe qu'au manche
  const grip = easeGrip(v, stop ? 1 : speedForTurn(diff), dt);
  step(v, dt, want, stop ? 0 : MAXSPD*mudK*(v.mul||1)*grip, true);
  if (dec){ const T = outilXZ(v, _out2); return Math.hypot(vrai.x-T.x, vrai.z-T.z); }
  return Math.hypot(target.x-v.pos.x, target.z-v.pos.z);
}
function lanesFor(W){
  const L = [], cols = Math.max(1, Math.ceil(P/W));
  for(let i=0;i<cols;i++){
    const x = X0 + W/2 + i*((P-W)/Math.max(1,cols-1));
    L.push(new THREE.Vector3(x,0, i%2 ? Z0+P+10 : Z0-10));
    L.push(new THREE.Vector3(x,0, i%2 ? Z0-10 : Z0+P+10));
  }
  return L;
}
const _tp = new THREE.Vector3(), _tq = new THREE.Quaternion(), _tsc = new THREE.Vector3(),
      _te = new THREE.Euler(), _spout = new THREE.Vector3(), _bin = new THREE.Vector3();
function toolPose(v){
  const T = v.g.userData.tool; if (!T) return null;
  v.h.updateMatrixWorld(true);
  T.obj.matrixWorld.decompose(_tp,_tq,_tsc);
  _te.setFromQuaternion(_tq,'YXZ');
  return { x:_tp.x, z:_tp.z, a:_te.y, W:T.W, near:T.near, far:T.far };
}

// échantillonne le ruban à la largeur exacte de l'outil, tous les 25 cm
function laySwath(v, layer){
  const p = toolPose(v); if (!p) return;
  const mid = (p.near + p.far)/2;
  const x = p.x + Math.sin(p.a)*mid, z = p.z + Math.cos(p.a)*mid;
  if (v.swX !== undefined){
    const dd = Math.hypot(x-v.swX, z-v.swZ);
    if (dd < .25) return;
    SWATH.add(layer, x, z, p.a, p.W, dd < 1.6 && v.swL === layer);
  } else {
    SWATH.add(layer, x, z, p.a, p.W, false);
  }
  v.swX = x; v.swZ = z; v.swL = layer;
}
function applyTool(v, fn){
  const p = toolPose(v); if (!p) return 0;
  const cs = Math.cos(-p.a), sn = Math.sin(-p.a);
  const R = p.W/2 + Math.max(Math.abs(p.near), Math.abs(p.far)) + .5;
  const i0 = Math.max(0, Math.floor((p.x-R-X0)/CS)), i1 = Math.min(NS-1, Math.ceil((p.x+R-X0)/CS));
  const j0 = Math.max(0, Math.floor((p.z-R-Z0)/CS)), j1 = Math.min(NS-1, Math.ceil((p.z+R-Z0)/CS));
  let n = 0;
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const cx = X0+(i+.5)*CS, cz = Z0+(j+.5)*CS;
    const dx = cx-p.x, dz = cz-p.z;
    const lx = dx*cs+dz*sn, lz = -dx*sn+dz*cs;
    if (Math.abs(lx) < p.W/2 && lz > p.near && lz < p.far) n += fn(j*NS+i) ? 1 : 0;
  }
  return n;
}

// ---------- cycle ----------
const STAGES = [
  { k:'prep',    n:'Préparer', ic:'🚜', d:'Déchaumeuse — travail du sol' },
  { k:'sow',     n:'Semer',    ic:'🌱', d:'Semoir — mise en terre' },
  { k:'fert',    n:'Engrais',  ic:'💧', d:'Pulvérisateur — rampes déployées' },
  { k:'grow',    n:'Pousse',   ic:'🌿', d:'La culture mûrit' },
  { k:'harvest', n:'Moisson',  ic:'🌾', d:'Moissonneuse — la benne vient au transfert' }
];
let stage = 0, coins = 0, stock = 0;
// Toute la flotte vit sur la carte. On passe d'un engin à l'autre sans que le précédent
// disparaisse : il garde son tracé, continue de rouler et continue de travailler. `worker`
// et `hauler` ne sont plus que des vues sur la flotte, rafraîchies à chaque image.
const KINDS = ['prep','sow','fert','harvest','trailer'];
const fleet = { prep:null, sow:null, fert:null, harvest:null, trailer:null };
let driven = 'prep';            // clé de l'engin qui répond aux commandes
let worker = null, hauler = null;
function fleetGet(kind){
  if (!KINDS.includes(kind)) return null;
  if (!fleet[kind]){
    const v = vehicle(kind), n = KINDS.indexOf(kind);
    v.pos.set(GATE.x + (n-2)*5.8, 0, GATE.z - 2);   // rangés côte à côte, sans se toucher
    v.heading = Math.PI; v.h.position.set(v.pos.x, 0, v.pos.z);
    if (kind === 'trailer'){ v.hop = 0; v.paid = 0; v.cropId = crop().id; }
    const tw = v.g.userData.tool ? v.g.userData.tool.W : 4;
    v.lanes = lanesFor(tw); v.laneI = 0; v.done = false;
    v.path = []; v.head = 0; v.goto = null;
    fleet[kind] = v;
  }
  return fleet[kind];
}
function syncFleet(){ worker = fleet[STAGES[stage].k] || null; hauler = fleet.trailer; }
function pilote(){ return fleet[driven] || null; }
const CAP0 = 900, TRCAP0 = 1800;   // une trémie qui tient un vrai bout de parcelle
let CAP = CAP0, TRCAP = TRCAP0;
const elNow = null;

function refreshNow(){
  if (typeof drawCropBtn === 'function') drawCropBtn();
  if (typeof drawVeh === 'function') drawVeh();
}
// Ne fait plus que remettre l'affichage et les rangs à jour. Effacer la parcelle et payer
// la semence appartiennent au cycle, pas au choix d'un engin : tant qu'ils étaient ici,
// reprendre la déchaumeuse remettait tout le champ à nu d'un coup, et reprendre le semoir
// repayait la semence.
function startStage(){
  const s = STAGES[stage];
  document.querySelectorAll('#steps .step').forEach((e,i) => {
    e.classList.toggle('on', i === stage);
    e.classList.toggle('done', i < stage);
  });
  refreshNow();
  if (s.k !== 'grow') fleetGet(s.k);   // l'engin du chantier existe, mais rien n'est détruit
  syncFleet();
  if (worker){ worker.lanes = lanesFor(toolW(worker)); worker.laneI = 0; worker.done = false; }
}
function toolW(v){ return v && v.g.userData.tool ? v.g.userData.tool.W : 4; }
// la semence est une vraie dépense : trop juste, on retombe sur le blé, qui ne coûte rien
function paySeed(){
  const c = crop();
  if (!c.seed) return;
  if (coins >= c.seed){
    coins -= c.seed;
    toast('Semence ' + c.emo + ' ' + c.n + ' : −' + c.seed + ' 🪙');
  } else {
    cropI = 0; applyCrop(); refreshNow();
    toast('Trésorerie trop juste : on sème du blé', 'bad'); sfx('deny');
  }
  save();
}
function nextStage(){
  const fini = STAGES[stage];
  const suivait = driven === fini.k;   // on conduisait celui qui vient de finir : on suit le chantier
  stage = (stage+1) % STAGES.length;
  if (stage === 0){ harvests++; SWATH.reset(); }   // cycle bouclé : la parcelle repart à nu
  if (STAGES[stage].k === 'sow') paySeed();        // la semence se règle en entrant au semis
  startStage(); sfx('stage'); save();
  if (fleet[fini.k]) fleet[fini.k].done = true;
  if (suivait){
    const k = STAGES[stage].k;
    if (KINDS.includes(k)){ driven = k; syncFleet(); drawVeh(); }
  }
  toast(fini.ic + ' ' + fini.n + ' — terminé !', 'good');
  confetti(stage === 0 ? 34 : 14);
}
// Changer d'étape ne déplace ni ne supprime rien : chaque engin reste où il est.
function switchTo(i){
  if (i === stage) return;
  stage = i; startStage();
}

// ---------- son : tout est synthétisé, aucun fichier à charger ----------
const SND = (function(){
  let ctx = null, master = null, eng = null, engG = null, rainG = null, on = true;
  function boot(){
    if (!on) return;
    // le contexte peut naître suspendu (politique d'autoplay) : on le relance à chaque geste
    if (ctx){ if (ctx.state === 'suspended') ctx.resume().catch(()=>{}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { ctx = new AC(); } catch(e){ return; }
    master = ctx.createGain(); master.gain.value = .5; master.connect(ctx.destination);
    engG = ctx.createGain(); engG.gain.value = 0;                 // ronflement moteur
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 640;
    eng = ctx.createOscillator(); eng.type = 'sawtooth'; eng.frequency.value = 58;
    eng.connect(lp); lp.connect(engG); engG.connect(master); eng.start();
    const len = Math.floor(ctx.sampleRate*2);                    // pluie : bruit blanc filtré
    const buf = ctx.createBuffer(1,len,ctx.sampleRate), ch = buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i] = (Math.random()*2-1)*.5;
    const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = .5;
    rainG = ctx.createGain(); rainG.gain.value = 0;
    src.connect(bp); bp.connect(rainG); rainG.connect(master); src.start();
  }
  return {
    boot,
    isOn(){ return on; },
    set(v){ on = v; if (on){ boot(); if (master) master.gain.value = .5; }
            else if (master) master.gain.value = 0; return on; },
    toggle(){ return this.set(!on); },
    engine(spd, working){
      if (!ctx || !on) return;
      eng.frequency.setTargetAtTime(50 + spd*13, ctx.currentTime, .12);
      engG.gain.setTargetAtTime(working ? .045 + spd*.011 : 0, ctx.currentTime, .25);
    },
    rain(a){ if (!ctx || !on) return; rainG.gain.setTargetAtTime(a*.11, ctx.currentTime, .6); },
    blip(f0,f1,dur,type,vol){
      if (!ctx || !on) return;
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
      o.type = type || 'triangle'; o.frequency.setValueAtTime(f0, t);
      if (f1) o.frequency.exponentialRampToValueAtTime(f1, t+dur);
      g.gain.setValueAtTime(.0001, t);
      g.gain.linearRampToValueAtTime(vol || .2, t+.012);
      g.gain.exponentialRampToValueAtTime(.0001, t+dur);
      o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.03);
    }
  };
})();

const dec1 = v => v.toFixed(1).replace('.0','').replace('.', ',');

  { t:.23, sky:'#42598a', hs:'#a9b6d8', hg:'#41573a', hi:.74, si:.28, sc:'#c0cdf0', nuit:.85 },

const WEATHER = {
  clear: { n:'Dégagé',  emo:'☀️', dim:1,   wind:.10, rain:0, mud:1 },
  cloud: { n:'Nuageux', emo:'⛅', dim:.84, wind:.18, rain:0, mud:1 },
  rain:  { n:'Pluie',   emo:'🌧️', dim:.58, wind:.27, rain:1, mud:.86 }
};
let wKey = 'clear', wNext = 60, curDim = 1, curWind = .1, curRain = 0, nightK = 0;
const _cA = new THREE.Color(), _cB = new THREE.Color(), _cX = new THREE.Color();
function skyAt(t){
  let i = 0;
  while (i < SKY.length-2 && t > SKY[i+1].t) i++;
  const a = SKY[i], b = SKY[i+1], f = (t-a.t)/Math.max(1e-6, b.t-a.t);
  const mix = (ka,kb) => _cX.set(_cA.set(ka)).lerp(_cB.set(kb), f).getHex();
  return { sky:mix(a.sky,b.sky), hs:mix(a.hs,b.hs), hg:mix(a.hg,b.hg),
           hi:a.hi+(b.hi-a.hi)*f, si:a.si+(b.si-a.si)*f, sc:mix(a.sc,b.sc),
           nuit:a.nuit+(b.nuit-a.nuit)*f };
}
function weatherTick(dt){
  wNext -= dt;
  if (wNext <= 0){
    const r = Math.random();
    const k = r < .50 ? 'clear' : r < .80 ? 'cloud' : 'rain';
    wNext = 45 + Math.random()*75;
    if (k !== wKey){ wKey = k; toast(WEATHER[k].emo + ' ' + WEATHER[k].n); }
  }
  const W = WEATHER[wKey], k = Math.min(1, dt*.45);
  curDim  += (W.dim - curDim)*k;
  curWind += (W.wind - curWind)*k;
  curRain += (W.rain - curRain)*k;
  mudK = 1 - (1 - W.mud)*curRain;
  UW.amp.value = curWind;
}
const RAIN = (function(){
  const N = 440;
  const g = new THREE.BoxGeometry(.1,1.7,.1);          // vues de loin, des traits fins seraient invisibles
  const m = new THREE.InstancedMesh(g,
    new THREE.MeshBasicMaterial({ color:'#cfe6f6', transparent:true, opacity:.6, depthWrite:false }), N);
  m.frustumCulled = false; m.visible = false; m.renderOrder = 3; scene.add(m);
  const px = new Float32Array(N), py = new Float32Array(N), pz = new Float32Array(N);
  for(let i=0;i<N;i++){ px[i]=(Math.random()-.5)*74; py[i]=Math.random()*26; pz[i]=(Math.random()-.5)*74; }
  const d = new THREE.Object3D();
  d.rotation.set(.14,0,.1);
  return { update(dt, amount, cx, cz){
    m.visible = amount > .03;
    if (!m.visible) return;
    m.material.opacity = .62*amount;
    const n = Math.round(N*amount);
    for(let i=0;i<N;i++){
      py[i] -= (26 + (i%9)*1.4)*dt;
      if (py[i] < 0){ py[i] += 26; px[i]=(Math.random()-.5)*74; pz[i]=(Math.random()-.5)*74; }
      d.position.set(cx+px[i], py[i], cz+pz[i]);
      d.scale.set(1, i < n ? 1 : 0, 1);
      d.updateMatrix(); m.setMatrixAt(i, d.matrix);
    }
    m.instanceMatrix.needsUpdate = true;
  }};
})();

// ---------- sauvegarde ----------
const SKEY = 'ferme.cycle.v1';
function save(){
  try {
    localStorage.setItem(SKEY, JSON.stringify({
      v:1, coins, stock, totalT, harvests, lv, owned, cropI, stage, day, dayT,
      contract, son:SND.isOn(), ctrl:ctrlMode, conduit:driven,
      vue:{ z:+zoom.toFixed(3), p:+PITCH.toFixed(4), v:2 }
    }));
  } catch(e){ /* mode privé : on joue sans sauvegarde */ }
}
function restore(){
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SKEY) || 'null'); } catch(e){ d = null; }
  if (!d || d.v !== 1) return null;
  coins = +d.coins || 0; stock = +d.stock || 0;
  totalT = +d.totalT || 0; harvests = +d.harvests || 0;
  UPGRADES.forEach(u => { lv[u.id] = Math.max(0, Math.min(u.max, +d.lv?.[u.id] || 0)); });
  CROPS.forEach(c => { if (d.owned && d.owned[c.id]) owned[c.id] = true; });
  cropI = Math.max(0, Math.min(CROPS.length-1, +d.cropI || 0));
  if (!owned[CROPS[cropI].id]) cropI = 0;
  stage = Math.max(0, Math.min(STAGES.length-1, +d.stage || 0));
  day = Math.max(1, +d.day || 1); dayT = +d.dayT || .3;
  contract = d.contract && d.contract.qty ? d.contract : null;
  if (d.son === false) SND.set(false);
  if (CTRL.some(c => c.id === d.ctrl)) ctrlMode = d.ctrl;
  if (KINDS.includes(d.conduit)) driven = d.conduit;
  // Le cadrage d'usine a changé : une vue enregistrée avant ce réglage est périmée, on la
  // laisse tomber une fois pour reprendre 50° et ×1,25. Ce que le joueur règle ensuite est
  // conservé comme avant.
  if (d.vue && d.vue.v === 2){
    if (d.vue.z) zoom = Math.max(.45, Math.min(3.2, d.vue.z));
    if (d.vue.p) PITCH = Math.max(.48, Math.min(1.49, d.vue.p));
  }
  applyCamera();
  applyUpgrades();
  return d;
}
function wipe(){
  try { localStorage.removeItem(SKEY); } catch(e){}
  location.reload();
}

function paintParcel(layer){
  for(let z = Z0; z <= Z0+P+.01; z += .5) SWATH.add(layer, X0+P/2, z, 0, P, z > Z0);
}

(function(){
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let id = null;
  function set(e){
    const r = stick.getBoundingClientRect();
    const R = r.width*.36;                       // la course suit la taille réelle du manche
    let dx = e.clientX - (r.left+r.width/2), dy = e.clientY - (r.top+r.height/2);
    const m = Math.hypot(dx,dy) || 1, k = Math.min(1, m/R);
    jx = dx/m*k; jy = dy/m*k; jmag = k;
    knob.style.transform = `translate(${jx*R}px,${jy*R}px)`;
    if (jmag > .2) setManual();
  }
  stick.addEventListener('pointerdown', e => { SND.boot(); id = e.pointerId; stick.setPointerCapture(id); set(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId===id) set(e); });
  const clear = e => { if (e.pointerId!==id) return; id=null; jx=jy=jmag=0; knob.style.transform=''; };
  stick.addEventListener('pointerup', clear);
  stick.addEventListener('pointercancel', clear);
})();

// --- Le doigt, un seul gestionnaire pour tout :
//   une tape sur un engin le sélectionne ;
//   deux tapes sur le champ y envoient l'engin sélectionné ;
//   un balayage lui dessine un parcours, qu'il suit et qui s'efface derrière lui ;
//   deux doigts appartiennent à la caméra — écarter zoome, glisser déplace, tourner pivote.
// Un seul jeu d'écouteurs, aucune capture de pointeur, aucun pointerleave : ce sont eux qui
// faisaient rater le pincement une fois sur deux.
(function(){
  const el = document.getElementById('stage');
  const btn = document.getElementById('pathBtn');
  // Un tracé se mérite. Le doigt qui se pose et ripe de deux millimètres ne doit rien
  // lancer du tout : il faut du temps ET de la longueur, et tant que les deux ne sont pas
  // réunis on ne fait qu'enregistrer le geste, sans rien envoyer à l'engin.
  const SEUIL = 14;                                  // px : en dessous, c'était une tape
  const TENUE = 260;                                 // ms de doigt posé avant qu'un tracé prenne
  const LONGE = 58;                                  // px de trait réellement dessiné
  let mode = 'rien';                                 // 'rien' | 'esquisse' | 'trace' | 'camera'
  let id1 = null, x0 = 0, y0 = 0, t0 = 0, lg = 0, lx = 0, ly = 0, buf = [];
  let bD = 0, bZ = 1, bX = 0, bY = 0, bA = 0, cum = 0;
  let tapT = 0, tapX = 0, tapY = 0;
  const deux = () => { const it = TOUCH.values(); return [it.next().value, it.next().value]; };
  function baseCam(){
    const [a,b] = deux(); if (!a || !b) return;
    bD = Math.hypot(a.x-b.x, a.y-b.y) || 1; bZ = zoom;
    bX = (a.x+b.x)/2; bY = (a.y+b.y)/2;
    bA = Math.atan2(b.y-a.y, b.x-a.x); cum = 0;
  }
  btn.onclick = () => {                              // le bouton ne fait qu'arrêter
    const v = pilote(); if (!v) return;
    traceClear(v); v.goto = null; v.speed = 0; setManual(); drawPathBtn();
  };
  el.addEventListener('pointerdown', e => {
    if (paused) return;
    TOUCH.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (TOUCH.size === 1){
      id1 = e.pointerId; x0 = lx = e.clientX; y0 = ly = e.clientY;
      t0 = performance.now(); lg = 0; buf = []; mode = 'rien';
    }
    else if (TOUCH.size === 2){
      // un deuxième doigt : c'était un pincement, pas un tracé. On efface ce qu'on venait
      // de poser, sinon l'engin part sur un bout de trajet qu'on n'a jamais voulu.
      if (mode === 'trace'){ const v = pilote(); if (v) traceClear(v); }
      mode = 'camera'; baseCam();
    }
  });
  el.addEventListener('pointermove', e => {
    if (!TOUCH.has(e.pointerId)) return;
    TOUCH.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if (TOUCH.size >= 2){
      if (mode !== 'camera'){ mode = 'camera'; baseCam(); return; }
      const [a,b] = deux(); if (!a || !b) return;
      const d = Math.hypot(a.x-b.x, a.y-b.y) || 1;
      const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      const ang = Math.atan2(b.y-a.y, b.x-a.x);
      setZoom(bZ * d/bD);
      // la torsion ne prend qu'au-delà d'un seuil : sinon un simple glissement pivoterait
      let da = ang - bA;
      while (da >  Math.PI) da -= 6.28318;
      while (da < -Math.PI) da += 6.28318;
      bA = ang; cum += da;
      if (Math.abs(cum) > .10) setYaw(YAW + da);
      // le milieu des deux doigts entraîne la carte, dans le repère de la caméra
      const k = VIEW/SH;
      const sx = -(mx-bX)*k, sy = (my-bY)*k/Math.max(.35, Math.sin(PITCH));
      const cy = Math.cos(YAW), sn = Math.sin(YAW);
      camPan(sx*cy - sy*sn, -sx*sn - sy*cy);
      bX = mx; bY = my;
      return;
    }
    if (e.pointerId !== id1 || mode === 'camera') return;
    lg += Math.hypot(e.clientX-lx, e.clientY-ly);     // longueur réellement parcourue
    lx = e.clientX; ly = e.clientY;
    if (mode !== 'trace'){
      if (mode === 'rien'){
        if (Math.hypot(e.clientX-x0, e.clientY-y0) < SEUIL) return; // simple tremblement
        mode = 'esquisse';                           // le geste est parti, rien n'est décidé
      }
      buf.push({ x:e.clientX, y:e.clientY });
      if (lg < LONGE || performance.now()-t0 < TENUE) return;
      // temps et longueur y sont : le tracé prend, et il reprend le geste depuis le début
      const v = pilote(); if (!v) return;
      mode = 'trace'; traceClear(v); v.goto = null; setManual();
      const q = screenToWorld(x0, y0); if (q) traceAdd(v, q);
      for(const b of buf){ const w = screenToWorld(b.x, b.y); if (w) traceAdd(v, w); }
      buf = [];
      return;
    }
    const v = pilote(); if (!v) return;
    const p = screenToWorld(e.clientX, e.clientY); if (p) traceAdd(v, p);
  });
  function fin(e){
    if (!TOUCH.has(e.pointerId)) return;
    TOUCH.delete(e.pointerId);
    if (TOUCH.size >= 2){ baseCam(); return; }
    if (TOUCH.size === 1){                           // il reste un doigt du pincement
      const r = TOUCH.entries().next().value;
      id1 = r[0]; x0 = r[1].x; y0 = r[1].y; mode = 'camera';
      return;                                        // il ne tracera rien : le geste est fini
    }
    const etait = mode; mode = 'rien'; id1 = null; buf = [];
    // une esquisse trop courte ou trop brève ne vaut ni tape ni tracé : elle ne fait rien
    if (etait === 'esquisse'){ tapT = 0; return; }
    if (etait !== 'rien'){ drawPathBtn(); return; }
    // c'était une tape : sur un engin elle sélectionne, sur le champ elle vise
    const cible = vehicleAt(e.clientX, e.clientY);
    if (cible){ tapT = 0; if (cible !== pilote()) selectVeh(cible.kind); return; }
    const now = performance.now();
    if (now - tapT < 340 && Math.hypot(e.clientX-tapX, e.clientY-tapY) < 30){
      tapT = 0;
      const p = screenToWorld(e.clientX, e.clientY); if (!p) return;
      const v = pilote(); if (!v) return;
      traceClear(v); v.goto = p; setManual(); pingSol(p.x, p.z); drawPathBtn();
    } else { tapT = now; tapX = e.clientX; tapY = e.clientY; }
  }
  ['pointerup','pointercancel'].forEach(ev => el.addEventListener(ev, fin));
})();
// Repère de sélection : un petit triangle planté au-dessus de l'engin conduit. Il tourne
// avec la caméra pour rester de face, et bat doucement pour se distinguer du décor.
const MARK = (function(){
  // un triangle plat, pointe en bas, toujours face à la caméra : un volume se lirait
  // comme un losange dès qu'on tourne la vue
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(
    [0,0,0, -.82,1.2,0, .82,1.2,0], 3));
  g.computeVertexNormals();
  const grp = new THREE.Group();
  const fond = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color:'#5c4a20', side:THREE.DoubleSide, depthTest:false, depthWrite:false }));
  fond.scale.setScalar(1.22); fond.position.set(0,-.13,-.01);
  const face = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color:'#ffc93c', side:THREE.DoubleSide, depthTest:false, depthWrite:false }));
  grp.add(fond, face);
  grp.renderOrder = 7; grp.visible = false; scene.add(grp);
  return grp;
})();
// quel engin se trouve sous le doigt ? on vise les maillages, pas le sol derrière eux
function vehicleAt(cx, cy){
  const r = stageEl.getBoundingClientRect();
  _ndc.set(((cx-r.left)/r.width)*2-1, -((cy-r.top)/r.height)*2+1);
  _ray.setFromCamera(_ndc, camera);
  const objs = [];
  for(const k of KINDS){ const v = fleet[k]; if (v) objs.push(v.h); }
  const hits = _ray.intersectObjects(objs, true);
  if (!hits.length) return null;
  for(const k of KINDS){
    const v = fleet[k]; if (!v) continue;
    let o = hits[0].object;
    while (o){ if (o === v.h) return v; o = o.parent; }
  }
  return null;
}
// repère posé au sol à l'endroit désigné : sans lui on ne sait pas si l'appui a été pris
const PING = (function(){
  const g = new THREE.RingGeometry(.7, 1.5, 22); g.rotateX(-Math.PI/2);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color:'#ffe07a', transparent:true, opacity:0, depthWrite:false }));
  m.frustumCulled = false; m.visible = false; scene.add(m);
  return { m, t:0 };
})();
function pingSol(x,z){
  PING.m.position.set(x, parcelY(x,z)+.06, z);
  PING.m.visible = true; PING.t = 0;
}
function setManual(){
  if (manual) return;
  manual = true; if (btnAuto) btnAuto.classList.remove('on');
}
function setAuto(){
  manual = false;
  if (btnAuto) btnAuto.classList.add('on');
  const v = worker || pilote();
  if (v && v.lanes){
    traceClear(v); v.goto = null;
    let best = 0, bd = 1e9;
    v.lanes.forEach((l,i) => { const d = l.distanceTo(v.pos); if (d<bd){ bd=d; best=i; } });
    v.laneI = best; v.wpT = 0; v.done = false;
  }
}

  if (keys.arrowdown  || keys.s)           y += 1;
  if (keys.arrowleft  || keys.a || keys.q) x -= 1;
  if (keys.arrowright || keys.d)           x += 1;

// ---------- collisions ----------
// Tout est ramené à des disques : le décor y est réduit une fois pour toutes, et un engin
// vaut son gabarit. On repousse hors du chevauchement plutôt que d'annuler le mouvement :
// l'engin glisse le long d'un mur au lieu de s'y coller.
// Repousser hors du chevauchement ne suffisait pas : l'engin restait le nez dans le mur et
// poussait dessus. On retient donc la direction de la poussée, et on braque du même côté —
// le mur écarte l'avant au lieu de l'arrêter, et l'engin longe puis contourne.
function unstick(v){
  const sn = Math.sin(v.heading), cs = Math.cos(v.heading);
  const B = v.corps || CORPS.prep;
  let px = 0, pz = 0, tor = 0, prof = 0;
  // pousser (dx,dz) sur le disque placé à `off` : ça déplace l'engin et le fait pivoter,
  // puisqu'une poussée reçue à l'arrière chasse l'arrière et rentre le nez.
  const pousse = (off, dx, dz, k, p) => {
    v.pos.x += dx*k; v.pos.z += dz*k;
    px += dx*k; pz += dz*k;
    tor += off * (dx*k*cs - dz*k*sn);
    if (p > prof) prof = p;
  };
  for(let b=0;b<B.length;b++){
    const off = B[b][0], R = B[b][1];
    const cx = v.pos.x + sn*off, cz = v.pos.z + cs*off;
    for(let i=0;i<OBST.length;i++){
      const o = OBST[i], dx = cx-o.x, dz = cz-o.z;
      const min = R + o.r, d2 = dx*dx + dz*dz;
      if (d2 >= min*min) continue;
      const d = Math.sqrt(d2) || 1e-3;
      pousse(off, dx, dz, (min-d)/d, min-d);
    }
    for(let i=0;i<KINDS.length;i++){
      const w = fleet[KINDS[i]];
      if (!w || w === v) continue;
      const WB = w.corps || CORPS.prep, wsn = Math.sin(w.heading), wcs = Math.cos(w.heading);
      for(let c=0;c<WB.length;c++){
        const wx = w.pos.x + wsn*WB[c][0], wz = w.pos.z + wcs*WB[c][0];
        const dx = cx-wx, dz = cz-wz;
        const min = R + WB[c][1], d2 = dx*dx + dz*dz;
        if (d2 >= min*min) continue;
        const d = Math.sqrt(d2) || 1e-3, k = (min-d)/d*.5;   // chacun recule de moitié
        pousse(off, dx, dz, k, min-d);
        w.pos.x -= dx*k; w.pos.z -= dz*k;
      }
    }
  }
  if (!prof) return;
  v.heading += Math.max(-.13, Math.min(.13, tor*.5));
  // et si le couple est nul — choc de plein fouet — on choisit quand même un côté
  const cote = px*cs - pz*sn;
  if (Math.abs(tor) < .02) v.heading += (cote >= 0 ? 1 : -1) * Math.min(.11, prof*.55);
  v.cote = cote >= 0 ? 1 : -1;                           // l'évitement contournera du même côté
  v.choc = 1.4;                                          // mémoire de contact, en secondes
  v.speed *= .74; v.line = 0;                            // on ralentit sans caler
}
// Évitement. Une simple poussée latérale ne suffisait pas : l'engin venait buter sur la
// grange et s'y usait. On vise donc la tangente de l'obstacle qui bloque — l'écart exact
// pour le raser — et on garde le même côté tant qu'il gêne, sinon l'engin hésite entre
// les deux et n'avance plus.
// `portee` = distance du but. Sans elle, un obstacle situé derrière le point visé faisait
// tourner l'engin autour indéfiniment : il ne pouvait plus jamais atteindre un point posé
// près d'un bâtiment ou d'un autre engin. On n'évite que ce qui est sur le chemin.
function dodge(v, want, portee){
  v.choc = Math.max(0, (v.choc || 0) - .016);            // le souvenir du choc s'estompe
  const marge = v.choc > 0 ? 2.6 : 1.4;                  // fraîchement touché : on passe plus large
  const R = (v.rad || 2.2) + marge;
  const but = portee === undefined ? 1e9 : portee;
  const look = Math.min(but, Math.max(12, v.speed*1.8));
  const sn = Math.sin(want), cs = Math.cos(want);
  let bloc = null, proche = 1e9;
  const nez = v.avant || 2.2;                             // l'obstacle se mesure depuis l'avant
  const test = (ox, oz, orad) => {
    const dx = ox - v.pos.x, dz = oz - v.pos.z;
    const along = dx*sn + dz*cs - nez;                    // distance devant le nez
    if (along <= -orad - nez) return;                     // derrière : il ne gêne plus
    if (along > but + .5) return;                         // au-delà du but : il ne gêne pas
    const side = dx*cs - dz*sn;                           // écart latéral, positif à droite
    const need = R + orad;
    if (Math.abs(side) > need) return;                    // on passe à côté sans le frôler
    const dist = Math.max(.1, Math.hypot(dx, dz) - nez);
    if (dist > look + orad || dist >= proche) return;
    proche = dist; bloc = { along, side, need, dist };
  };
  for(let i=0;i<OBST.length;i++){ const o = OBST[i]; test(o.x, o.z, o.r); }
  for(let i=0;i<KINDS.length;i++){
    const w = fleet[KINDS[i]];
    if (!w || w === v) continue;
    // la moissonneuse et la benne doivent pouvoir se rapprocher pour la vidange : entre
    // elles deux, on garde le choc mais pas l'évitement, sinon la goulotte ne trouve jamais
    if ((v.kind === 'harvest' && w.kind === 'trailer') ||
        (v.kind === 'trailer' && w.kind === 'harvest')) continue;
    const WB = w.corps || CORPS.prep, wsn = Math.sin(w.heading), wcs = Math.cos(w.heading);
    for(let c=0;c<WB.length;c++)
      test(w.pos.x + wsn*WB[c][0], w.pos.z + wcs*WB[c][0], WB[c][1]*.92);
  }
  if (!bloc){ v.cote = 0; return want; }
  if (!v.cote) v.cote = bloc.side >= 0 ? -1 : 1;          // il est à droite : on passe à gauche
  const demi = bloc.dist > bloc.need ? Math.asin(bloc.need/bloc.dist) : Math.PI/2;
  const rel  = Math.atan2(bloc.side, bloc.along);         // relèvement de l'obstacle
  return want + rel + v.cote*demi;
}

// ---------- pilotage d'un engin de la flotte ----------
// Ordre de priorité : le tracé dessiné, puis le point désigné au double-appui, puis le
// manche si c'est l'engin conduit, puis le pilote automatique si c'est celui du chantier.
// Une trémie pleine, c'est un chantier à l'arrêt : la moissonneuse ne doit pas continuer
// à tourner sur le champ en coupant dans le vide. Elle se range sur place et attend d'être
// vidée, puis reprend son parcours là où elle l'avait laissé — il n'est pas effacé.
// Le manche reste prioritaire, pour qu'on puisse toujours aller la chercher soi-même.
// La benne, elle, n'est jamais bloquée : pleine, il faut justement pouvoir l'amener au silo.
function pleine(v){ return v.kind === 'harvest' && v.hop >= CAP - .5; }
function driveOne(v, conduit, chantier, dt){
  if (pleine(v)){
    if (conduit && manual && jmag > .12){ driveManual(v, dt); return; }
    step(v, dt, v.heading, 0, false);
    return;
  }
  if (v.path && v.head < v.path.length){ followPath(v, dt); return; }
  if (v.goto){
    // `stop` mettrait la consigne de vitesse à zéro : on roule jusqu'au point, on ne s'y gare pas
    v.bloque = v.speed < 1.2 ? (v.bloque || 0) + dt : 0;
    if (v.bloque > 3){ v.bloque = 0; v.goto = null; v.speed = 0; return; }  // inatteignable
    if (driveTo(v, v.goto, dt, false, false, true) < RMIN + 1.2){ v.goto = null; v.speed = 0; }
    return;
  }
  if (conduit && manual){ driveManual(v, dt); return; }
  if (chantier && !manual){ autoWork(v, dt); return; }
  step(v, dt, v.heading, 0, false);                       // à l'arrêt, moteur au ralenti
}
function autoWork(v, dt){
  if (v.done){
    const waiting = v.kind === 'harvest' && v.hop > 1;
    const dist = driveTo(v, waiting ? v.pos : GATE, dt, waiting);
    if (!waiting && dist < RMIN+1) nextStage();
    return;
  }
  const t = v.lanes[v.laneI];
  const full = v.kind === 'harvest' && v.hop >= CAP - .5;
  v.wpT = (v.wpT||0) + dt;
  if (driveTo(v, t, dt, full) < RMIN || v.wpT > 30){      // RMIN : inutile de viser plus près
    v.laneI++; v.wpT = 0;
    if (v.laneI >= v.lanes.length) v.done = true;
  }
}
// ---------- l'outil d'un engin, appliqué là où il passe ----------
function work(v, dt){
  const d = v.g.userData;
  if (v.kind === 'prep'){
    const n = applyTool(v, i => setCell(i,1));
    laySwath(v, 0);
    if (n){
      popDust(v.pos.x - Math.sin(v.heading)*3.5, v.pos.z - Math.cos(v.heading)*3.5);
      // le déchaumage enfouit ce qui traînait : plants levés comme dépôt de paille
      plants.forEach((p,k) => {
        if (cell[p.ti]===1 && (p.g>0 || p.r)){ p.g = 0; p.r = 0; writePlant(k); }
      });
    }
    // la terre gicle derrière le rouleau, d'autant plus qu'on avance vite
    const q = toolPose(v);
    if (q && v.speed > .5){
      const back = -Math.sin(q.a), backZ = -Math.cos(q.a);
      let nb = Math.min(6, Math.round(dt*v.speed*9));
      while (nb-- > 0){
        const u = (Math.random()-.5)*q.W;
        const x = q.x + Math.cos(q.a)*u + back*.5, z = q.z - Math.sin(q.a)*u + backZ*.5;
        SOIL.spawn(x, parcelY(x,z)+.25, z,
                   back*(1.4+Math.random()*2.4) + (Math.random()-.5)*1.6,
                   1.8 + Math.random()*2.3,
                   backZ*(1.4+Math.random()*2.4) + (Math.random()-.5)*1.6,
                   .8 + Math.random()*.45, .8 + Math.random()*.8);
      }
    }
  }
  else if (v.kind === 'sow'){
    const n = applyTool(v, i => cell[i]===1 && setCell(i,2));
    laySwath(v, 1);
    if (n) plants.forEach((p,k) => { if (cell[p.ti]===2 && p.g===0){ p.g = .04; writePlant(k); } });
    const q = toolPose(v);
    if (q && v.speed > .3){
      let nb = Math.min(7, Math.round(dt*v.speed*13));
      while (nb-- > 0){
        const u = (Math.random()-.5)*q.W;
        const x = q.x + Math.cos(q.a)*u, z = q.z - Math.sin(q.a)*u;
        SEED.spawn(x, parcelY(x,z)+1.05, z,
                   (Math.random()-.5)*1.7 - Math.sin(q.a)*v.speed*.25,
                   .5 + Math.random()*.9,
                   (Math.random()-.5)*1.7 - Math.cos(q.a)*v.speed*.25,
                   .8 + Math.random()*.5, .8 + Math.random()*.6);
      }
    }
  }
  else if (v.kind === 'fert'){
    applyTool(v, i => cell[i]===2 && setCell(i,3));
    laySwath(v, 2);
    const q = toolPose(v);                       // buses réparties sur toute la rampe
    if (q && v.speed > .3){
      const NB = 8;                                   // une buse tous les mètres environ
      for(let k=0;k<NB;k++){
        const u = (k + .5)/NB*q.W - q.W/2 + (Math.random()-.5)*.4;
        popSpray(q.x + Math.cos(q.a)*u, 3.15, q.z - Math.sin(q.a)*u,
                 -Math.sin(q.a)*v.speed*.15, -Math.cos(q.a)*v.speed*.15);
      }
    }
  }
  else if (v.kind === 'harvest'){
    if (v.hop < CAP){
      let cut = 0;
      const q = toolPose(v);
      const cs = Math.cos(-q.a), sn = Math.sin(-q.a), RR = (q.W/2+1.2)*(q.W/2+1.2);
      for(let k=0;k<plants.length;k++){
        const p = plants[k];
        if (p.g < .55) continue;
        const dx = p.x-q.x, dz = p.z-q.z;
        if (dx*dx+dz*dz > RR) continue;
        const lx = dx*cs+dz*sn, lz = -dx*sn+dz*cs;
        if (Math.abs(lx) < q.W/2 && lz > q.near && lz < q.far){ p.g = 0; p.r = 1; writePlant(k); cut++; }
      }
      if (cut){
        v.hop = Math.min(CAP, v.hop + cut*crop().yieldK);
        applyTool(v, i => setCell(i,0));
        laySwath(v, 3);
        if (Math.random()<.3) popDust(v.pos.x-Math.sin(v.heading)*2.5,
                                      v.pos.z-Math.cos(v.heading)*2.5);
      }
    }
    if (d.fill) d.fill.scale.y = .02 + v.hop/CAP*.98;
  }
}

// ---------- boucle ----------
const clock = new THREE.Clock();
let jbx=0,jbvx=0,jbz=0,jbvz=0;
const JK=40, JD=3.1;
const elCoins=document.getElementById('coins'), elStock=document.getElementById('stock'),
      elClock=document.getElementById('clock'), elWIcon=document.getElementById('wIcon'),
      elLvl=document.getElementById('lvl'), elGauge=document.getElementById('gauge'),
      elGVal=document.getElementById('gval'), chipLvl=document.getElementById('chipLvl');

let saveT = 0, lastCoins = -1, lastLvl = 0;
(function boot(){
  const had = restore();
  applyCrop();
  if (had && stage > 0) primeField(stage);   // on reprend la parcelle telle que l'étape la suppose
  // Toute la flotte est là dès le lancement, rangée sur la cour à côté du hangar. On ne la
  // découvre plus au fur et à mesure : les cinq engins attendent, on prend celui qu'on veut.
  KINDS.forEach(fleetGet);
  startStage();                              // ni remise à nu ni semence : c'est l'affaire du cycle
  if (fleet[STAGES[stage].k]) driven = STAGES[stage].k;
  syncFleet(); drawVeh(); camFollow();
  { const v = pilote(); if (v) camLook.set(v.pos.x, 1, v.pos.z); }
  applyCtrl();
  if (!contract) newContract(); else drawContract();
  if (!had) setTimeout(() => openPanel('help'), 400);   // première partie : on montre les commandes
})();

(function loop(){
  requestAnimationFrame(loop);
  const tick = Math.min(clock.getDelta(), .05), now = clock.getElapsedTime();
  const raw = paused ? 0 : tick, dt = raw*SPEED;
  UW.t.value = now;
  if (!paused) readKeys();

  // --- journée, météo, lumière
  weatherTick(dt);
  dayT += dt/DAYLEN;
  while (dayT >= 1){ dayT -= 1; day++; }
  const sk = skyAt(dayT);
  nightK = sk.nuit;
  scene.background.setHex(sk.sky).multiplyScalar(.62 + .38*curDim);
  hemi.color.setHex(sk.hs); hemi.groundColor.setHex(sk.hg);
  hemi.intensity = sk.hi*(.7 + .3*curDim);
  sun.color.setHex(sk.sc); sun.intensity = sk.si*(.45 + .55*curDim);
  const glow = Math.max(nightK, 1 - curDim*1.05);          // phares : la nuit et sous l'averse

  jbvx += (-JK*jbx - JD*jbvx)*raw + (Math.sin(now*1.6)*.5 + Math.sin(now*2.7)*.3)*raw;
  jbvz += (-JK*jbz - JD*jbvz)*raw + (Math.sin(now*1.35+1.4)*.42)*raw;
  jbx = Math.max(-.28,Math.min(.28,jbx+jbvx*raw)); jbz = Math.max(-.28,Math.min(.28,jbz+jbvz*raw));
  UJ.bend.value.set(jbx,0,jbz);
  const flash = Math.max(0, Math.sin(now*6.2))**3;
  [worker, hauler].forEach(v => {
    if (!v) return;
    (v.g.userData.beacons||[]).forEach(b => b.material.emissive.setRGB(flash, flash*.42, 0));
    (v.g.userData.lamps||[]).forEach(m => m.material.emissive.setRGB(glow, glow*.9, glow*.62));
  });

  const S = STAGES[stage];
  syncFleet();

  // Toute la flotte roule, pas seulement l'engin conduit : chacun suit son tracé ou son
  // point d'arrivée, et celui du chantier reprend le pilote automatique s'il n'a rien d'autre.
  for (const k of KINDS){
    const v = fleet[k]; if (!v) continue;
    driveOne(v, k === driven, k === S.k, dt);
  }
  // Et chacun travaille avec son propre outil, là où il passe. Un engin qu'on a laissé sur
  // un tracé continue donc son chantier pendant qu'on en conduit un autre.
  for (const k of KINDS){
    const v = fleet[k];
    if (v && k !== 'trailer' && v.speed > .12) work(v, dt);
  }
  if (fleet.harvest && fleet.harvest.g.userData.fill)
    fleet.harvest.g.userData.fill.scale.y = .02 + fleet.harvest.hop/CAP*.98;

  // pousse continue
  let ripe = 0, sown = 0, gsum = 0;
  const growK = dt*GROWK*crop().grow, rainK = curRain*.009;
  for(let k=0;k<plants.length;k++){
    const p = plants[k], t = cell[p.ti];
    if (p.g > 0){ sown++; gsum += p.g; }
    if (t >= 2 && p.g > 0 && p.g < 1){   // l'engrais accélère fortement, il ne bloque plus
      p.g = Math.min(1, p.g + ((t===3 ? .032 : .006) + rainK)*growK);
      writePlant(k);
    }
    if (p.g > .8) ripe++;
  }
  if (S.k === 'grow' && !manual && (sown === 0 || ripe >= sown*.95)) nextStage();
  // Les grains blancs s'effacent avec la maturité, pas avec l'étape en cours : dès que les
  // brins sont franchement sortis, la terre ne doit plus montrer un seul point de semence,
  // même si le pulvérisateur n'a pas fini son travail. Pleins jusqu'à 15 % de maturité,
  // disparus à 38 % — c'est-à-dire dès l'entrée dans la pousse.
  const mur = sown ? gsum/sown : 0;
  const grainCible = !sown ? 0 : 1 - Math.max(0, Math.min(1, (mur - .15)/.23));
  GRAIN.value += (grainCible - GRAIN.value) * Math.min(1, dt*1.6);
  chunks.forEach(c => {
    if (c.dirty){ c.young.instanceMatrix.needsUpdate = true;
                  c.ripe.instanceMatrix.needsUpdate = true;
                  c.straw.instanceMatrix.needsUpdate = true; c.dirty = false; }
    let y = 0, r = 0, st = 0;
    for(const k of c.list){
      const pl = plants[k];
      if (pl.r) st++;
      if (pl.g > 0){ if (pl.g < .8) y++; if (pl.g > .62) r++; }
    }
    c.young.visible = y > 0; c.ripe.visible = r > 0; c.straw.visible = st > 0;   // pas de maillage vide au GPU
  });

  // tracteur de transfert
  // ---------- moisson : la benne se conduit, elle ne vient plus toute seule ----------
  const combine = (worker && worker.kind === 'harvest') ? worker : null;
  const cFull = !!combine && (combine.hop >= CAP - .5 || (combine.done && combine.hop > .5));


  // transfert : uniquement quand la benne est venue se ranger sous la goulotte
  let vidange = false;
  if (combine && hauler && combine.hop > .5 && hauler.hop < TRCAP - .5){
    combine.h.updateMatrixWorld(true); hauler.h.updateMatrixWorld(true);
    combine.g.userData.spout.getWorldPosition(_spout);
    hauler.g.userData.bin.getWorldPosition(_bin);
    const gap = Math.hypot(_spout.x-_bin.x, _spout.z-_bin.z);
    const deployee = combine.g.userData.auger.rotation.y < .55;
    if (gap < 3.4 && deployee) vidange = true;
  }
  if (vidange){
    const give = Math.min(combine.hop, 150*dt, TRCAP-hauler.hop);
    combine.hop -= give; hauler.hop += give;
    // débit calé sur le temps, pas sur l'image : sinon le jet sature à 60 fps
    if (give > 0 && Math.random() < Math.min(.9, dt*30))
      popGrain(_spout.x, _spout.y, _spout.z, _bin.x, _bin.z);
    if (Math.random() < .05) popDust(_bin.x, _bin.z);
  }
  // La vis reste rangée pendant la coupe. Elle sort à trémie pleine comme avant, mais aussi
  // dès que la benne s'approche alors qu'il reste du grain — même une trémie à moitié se
  // vide, il suffit de venir la chercher. Le seuil de sortie est plus court que celui de
  // rentrée : sans cela la vis battait dès qu'on longeait la benne à la limite.
  if (combine){
    const a = combine.g.userData.auger;
    const reste = combine.hop > .5;
    const place = !!hauler && hauler.hop < TRCAP - .5;
    const dist = hauler ? combine.pos.distanceTo(hauler.pos) : 1e9;
    combine.augWant = cFull || vidange ||
                      (reste && place && dist < (combine.augWant ? 17 : 13));
    a.rotation.y += ((combine.augWant ? AUG_OPEN : AUG_FOLD) - a.rotation.y)*Math.min(1, dt*2.2);
  }
  if (combine && combine.g.userData.fill) combine.g.userData.fill.scale.y = .02 + combine.hop/CAP*.98;

  // livraison : on amène la benne au silo et elle se vide
  if (hauler){
    if (hauler.hop > .2 && hauler.pos.distanceTo(SILO) < 6){
      const give = Math.min(hauler.hop, 160*dt);
      const c = CROPS.find(x => x.id === hauler.cropId) || CROPS[0];
      const pay = give*c.price*PRICEK;
      hauler.hop -= give; stock += give; totalT += give; coins += pay;
      hauler.paid += pay;
      contractDeliver(c.id, give);
      if (hauler.paid > 700){                  // une tranche encaissée : le gain part vers le compteur
        floatCoin(SILO.x, SILO.z-2, '+' + fmt(hauler.paid));
        for(let i=0;i<4;i++) flyCoin(SILO.x, SILO.z-2, i*70);
        hauler.paid = 0; sfx('coin');
      }
      if (hauler.hop <= .2){ hauler.cropId = crop().id; sfx('cash'); save(); toast('Benne vidée au silo', 'good'); }
    }
    const rf = hauler.g.userData.fill;                  // benne ouverte : vide, on doit voir le fond
    if (rf){ rf.visible = hauler.hop > .5; rf.scale.y = .01 + hauler.hop/TRCAP*.99; }
  }

  // le joueur est prévenu une seule fois par remplissage
  if (cFull && !combine.warned){ combine.warned = true; toast('Trémie pleine — prends la benne', 'bad'); sfx('deny'); }
  if (combine && !cFull) combine.warned = false;
  drawVeh();

  if (combine && !combine.done && !manual){
    let left = 0;
    for(let k=0;k<plants.length;k++) if (plants[k].g > .55){ left++; break; }
    if (left === 0) combine.done = true;
  }

  SOIL.update(dt); SEED.update(dt);
  grains.forEach(d => {
    if(!d.m.visible) return;
    d.t += dt; d.vy -= 9.2*dt;
    d.m.position.x += d.vx*dt; d.m.position.y += d.vy*dt; d.m.position.z += d.vz*dt;
    if (d.m.position.y < 1.1 || d.t > .8) d.m.visible = false;
  });
  spray.forEach(d => {
    if(!d.m.visible) return;
    d.t += dt; d.vy -= 7*dt;
    d.m.position.x += d.vx*dt; d.m.position.y += d.vy*dt; d.m.position.z += d.vz*dt;
    d.m.material.opacity = Math.max(0, .95 - d.t*1.1);
    if (d.m.position.y < parcelY(d.m.position.x, d.m.position.z) + .05 || d.t > .9) d.m.visible = false;
  });
  RAIN.update(tick, curRain, camLook.x, camLook.z);
  SND.rain(curRain);
  SND.engine(worker ? worker.speed : (hauler ? hauler.speed : 0),
             !!(worker || hauler) && !paused);
  TRACKS.update(raw);
  dust.forEach(d => {
    if(!d.m.visible) return;
    d.t += dt; d.m.position.y += d.vy*dt; d.m.scale.multiplyScalar(1+dt*.9);
    d.m.material.opacity = Math.max(0,.65-d.t*.8);
    if (d.t>.85) d.m.visible = false;
  });
  streaks.forEach(d => {                       // le rail s'efface là où il a été posé
    if(!d.m.visible) return;
    d.t += dt;
    const k = d.t/d.life;
    d.m.material.opacity = Math.max(0, d.a*(1-k)*(1-k));
    if (d.t > d.life) d.m.visible = false;
  });

  // caméra : suit l'engin piloté
  // caméra quasi figée : elle ne bouge que si l'engin sort d'une zone morte centrale
  // la caméra reste où on l'a posée : plus aucun recadrage automatique
  camera.position.copy(camLook).add(camOff);
  camera.lookAt(camLook);
  // Le soleil est accroché au point visé pour que l'ombre porte là où on regarde. S'il y
  // saute, tout l'éclairage change d'un coup : on l'y amène en douceur.
  sunAt.x += (camLook.x - sunAt.x)*Math.min(1, raw*1.6);
  sunAt.z += (camLook.z - sunAt.z)*Math.min(1, raw*1.6);
  sun.position.set(sunAt.x+12, 32, sunAt.z+18);
  sun.target.position.set(sunAt.x, 0, sunAt.z); sun.target.updateMatrixWorld();

  const shownCoins = Math.floor(coins);
  if (shownCoins !== lastCoins){
    if (shownCoins > lastCoins) popChip(chipCoins);
    lastCoins = shownCoins; elCoins.textContent = fmt(shownCoins);
  }
  elStock.textContent = fmt(stock);
  const lvNow = level();
  if (lvNow !== lastLvl){
    elLvl.textContent = lvNow; popChip(chipLvl);
    if (lvNow > lastLvl && lastLvl > 0){ lvlShown = lvNow; levelUp(lvNow); }
    lastLvl = lvNow;
  }
  const hh = Math.floor(dayT*24), mm = Math.floor(dayT*1440 % 60);
  elClock.textContent = (hh<10?'0':'') + hh + ':' + (mm<10?'0':'') + mm;
  elWIcon.textContent = WEATHER[wKey].emo;

  // la jauge suit le chantier en cours : sol travaillé, puis maturité, puis trémie
  let gf = 0, gl = '';
  const NC = NS*NS;
  if (S.k === 'prep'){       gf = (cellN[1]+cellN[2]+cellN[3])/NC; gl = 'Sol ' + Math.round(gf*100) + ' %'; }
  else if (S.k === 'sow'){   gf = (cellN[2]+cellN[3])/NC;          gl = 'Semis ' + Math.round(gf*100) + ' %'; }
  else if (S.k === 'fert'){  gf = cellN[3]/NC;                     gl = 'Engrais ' + Math.round(gf*100) + ' %'; }
  else if (S.k === 'grow'){  gf = sown ? ripe/sown : 0;            gl = 'Maturité ' + Math.round(gf*100) + ' %'; }
  else if (driven === 'trailer' && hauler){ gf = hauler.hop/TRCAP; gl = 'Benne ' + Math.round(gf*100) + ' %'; }
  else {                     gf = combine ? combine.hop/CAP : (hauler ? hauler.hop/TRCAP : 0);
                             gl = (combine ? 'Trémie ' : 'Benne ') + Math.round(gf*100) + ' %'; }
  elGauge.firstElementChild.style.width = (gf*100).toFixed(1) + '%';
  elGVal.textContent = gl;
  elGauge.classList.toggle('full', gf > .985);

  if (pathState === 'trace') drawPathBtn();      // le bouton compte les points qui restent
  { const v = pilote();                           // le triangle de sélection
    if (v){ MARK.visible = true;
            MARK.position.set(v.pos.x, (v.gy||0) + (v.kind==='harvest'?4.9:3.9) + Math.sin(now*2.4)*.2, v.pos.z);
            MARK.quaternion.copy(camera.quaternion); }
    else MARK.visible = false; }
  if (PING.m.visible){                            // le repère du double-appui s'efface seul
    PING.t += tick;
    const k = Math.min(1, PING.t/1.1);
    PING.m.material.opacity = .75*(1-k);
    PING.m.scale.setScalar(1 + k*.9);
    if (k >= 1) PING.m.visible = false;
  }
  saveT += tick;
  if (saveT > 6){ saveT = 0; save(); }

  renderer.render(scene, camera);
})();

// sonde de mise au point : lecture seule, pratique pour vérifier une partie sans y jouer
window.__FARM_DEBUG = () => ({
  coins:Math.round(coins), stock:Math.round(stock), totalT:Math.round(totalT), harvests,
  stage, etape:STAGES[stage].n, culture:crop().id, jour:day, heure:+(dayT*24).toFixed(2),
  meteo:wKey, niveaux:Object.assign({}, lv), contrat:contract && {c:contract.crop, q:contract.qty, got:Math.round(contract.got)},
  manuel:manual, pause:paused, vitesse:SPEED,
  pilotage:ctrlMode, tracage:pathState, trace:traceLeft(pilote()), zoom:+zoom.toFixed(2),
  obstacles:OBST.length,
  cape:+(YAW*180/Math.PI).toFixed(1), vise:[+camLook.x.toFixed(1), +camLook.z.toFixed(1)],
  // pénétration la plus profonde de l'engin conduit dans un obstacle : doit rester nulle
  enfonce:(function(){
    const v = pilote(); if (!v) return 0;
    let pire = 0;
    const sn = Math.sin(v.heading), cs = Math.cos(v.heading);
    for(const b of v.corps){
      const cx = v.pos.x + sn*b[0], cz = v.pos.z + cs*b[0];
      for(const o of OBST) pire = Math.max(pire, (b[1]+o.r) - Math.hypot(cx-o.x, cz-o.z));
      for(const k of KINDS){ const w = fleet[k]; if (!w || w===v) continue;
        const ws = Math.sin(w.heading), wc = Math.cos(w.heading);
        for(const c of w.corps)
          pire = Math.max(pire, (b[1]+c[1]) - Math.hypot(cx-(w.pos.x+ws*c[0]), cz-(w.pos.z+wc*c[0])));
      }
    }
    return +pire.toFixed(2);
  })(),
  trav:(function(){ const o={}; for(const k of KINDS){ const v=fleet[k]; if(v) o[k]=+v.trav.toFixed(2); } return o; })(),
  grains:+GRAIN.value.toFixed(3),
  suivi:(function(){ const v = pilote(); if (!v) return null;
    return { tete:v.head, n:v.path?v.path.length:0, cote:v.cote||0, choc:+(v.choc||0).toFixed(2),
             bloque:+(v.bloque||0).toFixed(1), cap:+v.heading.toFixed(2),
             cible:v.__cible ? [+v.__cible.x.toFixed(1), +v.__cible.z.toFixed(1)] : null,
             pt0:(v.path&&v.path[v.head])?[+v.path[v.head].x.toFixed(1), +v.path[v.head].z.toFixed(1)]:null }; })(),
  finTrace:(function(){ const v = pilote(); if (!v || !v.path || !v.path.length) return null;
    const p = v.path[v.path.length-1]; return [+p.x.toFixed(2), +p.z.toFixed(2)]; })(),
  outil:(function(){ const v = pilote(); if (!v) return null;
    const p = outilXZ(v, {x:0,z:0}); return [+p.x.toFixed(2), +p.z.toFixed(2)]; })(),
  traceVu:!!(pilote() && pilote().trace && pilote().trace.mesh.visible),
  cap:+(worker ? worker.heading : 0).toFixed(3), vit:+(worker ? worker.speed : 0).toFixed(2),
  allure:+(worker && worker.grip !== undefined ? worker.grip : 1).toFixed(2),
  posX:+worker?.pos.x.toFixed(1), posZ:+worker?.pos.z.toFixed(1),
  cly:+(worker ? worker.gy || 0 : 0).toFixed(3), surTerre:+(worker ? worker.soil || 0 : 0).toFixed(2),
  elan:+(pilote() ? (pilote().line||0) : 0).toFixed(2),
  ecrase:+(pilote() ? ((pilote().sq||0)+(pilote().wob||0)) : 0).toFixed(3),
  penche:+(pilote() ? (pilote().rol||0) : 0).toFixed(3),
  traits:streaks.reduce((n,d)=>n+(d.m.visible?1:0),0),
  hop:worker ? Math.round(worker.hop) : 0,
  incl:Math.round(PITCH*180/Math.PI),
  conduit:driven, benneLa:!!hauler, benne:hauler ? Math.round(hauler.hop) : -1,
  // la flotte présente sur la carte : clé, position, points de tracé restants, but désigné
  flotte:KINDS.filter(k=>fleet[k]).map(k=>({k, x:+fleet[k].pos.x.toFixed(1), z:+fleet[k].pos.z.toFixed(1),
          v:+fleet[k].speed.toFixed(1), tr:traceLeft(fleet[k]),
          but:fleet[k].goto ? [+fleet[k].goto.x.toFixed(1), +fleet[k].goto.z.toFixed(1)] : null})),
  bx:+(hauler ? hauler.pos.x : 0).toFixed(1), bz:+(hauler ? hauler.pos.z : 0).toFixed(1),
  capMax:Math.round(CAP), trCapMax:Math.round(TRCAP),
  vis:+(worker && worker.g.userData.auger ? worker.g.userData.auger.rotation.y : -1).toFixed(2),
  // écart goulotte -> benne : c'est lui qui déclenche le transfert, pas la distance des engins
  ecart:(function(){
    if (!worker || worker.kind !== 'harvest' || !hauler) return -1;
    worker.h.updateMatrixWorld(true); hauler.h.updateMatrixWorld(true);
    const a = new THREE.Vector3(), b = new THREE.Vector3();
    worker.g.userData.spout.getWorldPosition(a); hauler.g.userData.bin.getWorldPosition(b);
    return +Math.hypot(a.x-b.x, a.z-b.z).toFixed(2);
  })(),
  capBenne:+(hauler ? hauler.heading : 0).toFixed(3),
  grain:grains.reduce((n,d)=>n+(d.m.visible?1:0),0),
  terre:SOIL.live(), graines:SEED.live(), gouttes:spray.reduce((n,d)=>n+(d.m.visible?1:0),0),
  paille:plants.reduce((n,p)=>n+(p.r?1:0),0),
  vole:document.querySelectorAll('#fx .fly').length,
  tri:renderer.info.render.triangles, appels:renderer.info.render.calls
});

})();
</script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>

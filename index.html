<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3f8a22">
<meta name="description" content="Déchaume, sème, fertilise, moissonne : conduis toute la saison et fais tourner l'exploitation.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Ferme — cycle complet</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --soil:#3d2b17; --soilD:#2a1d0f;
    --bark:#25341a; --barkL:#374a26; --barkE:#4d6733;
    --cream:#fff5e0; --creamD:#f2e2bd; --ink:#42301a; --inkSoft:#7a6440;
    --gold:#ffc93c; --goldD:#c07f0c;
    --grass:#4cb44e; --grassD:#2d7a2f;
    --rust:#e2593f; --rustD:#a83422;
    --sky:#4fa9de; --skyD:#2b7cad;
    --plum:#a374de; --plumD:#6f43a8;
    /* tout le chrome se mesure en hauteur d'écran : sur un petit téléphone,
       des tailles fixes ne laissaient qu'un tiers de l'écran au jeu */
    --sd:clamp(21px, 3.1vh, 26px);      /* diamètre d'une étape */
    --gap:clamp(4px, .8vh, 7px);
    --fsm:clamp(9.5px, 1.5vh, 11.5px);  /* petit texte */
  }

  html,body { height:100%; overflow:hidden; background:var(--bark); }
  body { font-family:-apple-system,"Segoe UI Rounded","Segoe UI",system-ui,sans-serif; font-weight:800;
         touch-action:none; user-select:none; color:var(--cream); }

  /* ---------- ossature : bandeaux pleins, scène au milieu ---------- */
  #ui { position:fixed; inset:0; display:flex; flex-direction:column; }
  #stage { position:relative; flex:1 1 auto; min-height:0; overflow:hidden; background:#54a52e;
           touch-action:none; }
  #app { position:absolute; inset:0; }
  canvas { display:block; }

  #top, #bot { flex:0 0 auto; position:relative; z-index:2;
               background:linear-gradient(180deg, var(--barkL), var(--bark)); }
  /* sur grand écran, le contenu des bandeaux reste groupé au centre */
  #top > *, #bot > * { width:100%; max-width:580px; margin-left:auto; margin-right:auto; }
  #top { padding:calc(env(safe-area-inset-top) + var(--gap)) 10px var(--gap);
         box-shadow:0 5px 0 rgba(0,0,0,.28), 0 14px 22px rgba(0,0,0,.3); }
  #top::after, #bot::before { content:''; position:absolute; left:0; right:0; height:4px;
         background:repeating-linear-gradient(90deg, var(--barkE) 0 14px, #5d7b3d 14px 28px); }
  #top::after { bottom:0; }
  #bot::before { top:0; }
  #bot { padding:var(--gap) 9px calc(min(env(safe-area-inset-bottom), 8px) + 3px);
         box-shadow:0 -5px 0 rgba(0,0,0,.28), 0 -14px 22px rgba(0,0,0,.3);
         display:flex; flex-direction:column; gap:var(--gap); }

  /* ---------- pastilles d'info ---------- */
  /* les pastilles se dimensionnent sur leur contenu : à quatre sur 360 px de large,
     une largeur égale les tronquait toutes */
  .chips { display:flex; gap:5px; justify-content:space-between; }
  .chip { flex:0 1 auto; min-width:0; display:flex; align-items:center; gap:5px;
          background:var(--cream); color:var(--ink); border-radius:999px;
          padding:3px 9px 3px 3px; box-shadow:0 3px 0 rgba(0,0,0,.34); }
  .chip .tok { flex:0 0 auto; width:clamp(20px, min(4vh, 7vw), 30px); aspect-ratio:1; border-radius:50%;
               display:grid; place-items:center; font-size:clamp(11px, min(2vh, 3.6vw), 15px);
               background:var(--goldD); box-shadow:inset 0 -2px 0 rgba(0,0,0,.22); }
  .chip b { font-size:clamp(10.5px, min(1.9vh, 3.5vw), 14px); font-weight:900;
            letter-spacing:-.3px; white-space:nowrap; }
  .chip em { font-style:normal; font-size:.78em; opacity:.62; margin-left:-2px; }
  .chip.c-wheat .tok { background:#e2a92c; }
  .chip.c-sky   .tok { background:var(--skyD); }
  .chip.c-lvl   .tok { background:var(--plumD); }
  .chip.pop { animation:pop .34s cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.16)} 100%{transform:scale(1)} }

  /* ---------- suivi du cycle ---------- */
  #steps { display:flex; align-items:flex-start; margin-top:var(--gap); }
  .step { flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:2px;
          position:relative; opacity:.5; pointer-events:auto; background:none; border:none;
          padding:0; font:inherit; color:inherit; }
  .step:focus-visible { outline:3px solid var(--gold); outline-offset:3px; border-radius:10px; }
  .step::before { content:''; position:absolute; top:calc(var(--sd)/2 - 2px); left:-50%; width:100%; height:5px;
                  background:rgba(0,0,0,.3); border-radius:3px; z-index:0; }
  .step:first-child::before { display:none; }
  .step.done::before, .step.on::before { background:var(--gold); }
  .step i { position:relative; z-index:1; width:var(--sd); height:var(--sd); border-radius:50%;
            display:grid; place-items:center; font-size:clamp(12px, 2vh, 15px); font-style:normal;
            background:var(--bark); border:3px solid rgba(0,0,0,.3); }
  .step span { font-size:clamp(7px, 1.15vh, 8.5px); text-transform:uppercase;
               letter-spacing:.3px; white-space:nowrap; }
  .step.done { opacity:.92; }
  .step.done i { background:var(--grassD); border-color:var(--grass); }
  .step.on { opacity:1; }
  .step.on i { background:var(--gold); border-color:#fff0bd; color:var(--ink);
               transform:scale(1.16); animation:beat 1.5s ease-in-out infinite; }
  .step.on span { color:var(--gold); }
  @keyframes beat { 0%,100%{transform:scale(1.16)} 50%{transform:scale(1.28)} }

  /* ---------- contrat ---------- */
  #contract { display:none; margin-top:var(--gap); background:rgba(0,0,0,.3); border-radius:12px;
              padding:4px 10px 5px; font-size:var(--fsm); }
  #contract.on { display:block; }
  #contract .hd { display:flex; align-items:center; gap:6px; }
  #contract .hd b { color:var(--gold); }
  #contract .hd .sp { flex:1; }
  #contract .bar { height:6px; border-radius:4px; background:rgba(0,0,0,.42); margin-top:3px;
                   overflow:hidden; box-shadow:inset 0 2px 0 rgba(0,0,0,.25); }
  #contract .bar i { display:block; height:100%; border-radius:5px; width:0;
                     background:linear-gradient(180deg,#ffe07a,var(--gold));
                     transition:width .3s ease-out; }

  /* ---------- bandeau bas ---------- */
  #gaugerow { margin-top:var(--gap); }
  #gauge { width:100%; height:clamp(17px, 2.5vh, 21px); border-radius:999px; background:rgba(0,0,0,.4);
           box-shadow:inset 0 2px 0 rgba(0,0,0,.3); position:relative; overflow:hidden; }
  #gauge i { position:absolute; inset:2px auto 2px 2px; width:0; border-radius:999px;
             background:linear-gradient(180deg,#8fe36a,var(--grassD)); transition:width .2s linear; }
  #gauge.full i { background:linear-gradient(180deg,#ffb36a,var(--rustD)); }
  #gauge.full { animation:beat2 .8s ease-in-out infinite; }
  @keyframes beat2 { 0%,100%{transform:scale(1)} 50%{transform:scale(1.045)} }
  #gauge span { position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(9.5px, 1.5vh, 11px);
                font-weight:900; text-shadow:0 1px 2px rgba(0,0,0,.6); }

  /* deux gros boutons, et tout le reste en pastilles de coin : le bandeau respire */
  #mainrow { display:flex; gap:9px; }
  .big { flex:1 1 0; min-width:0; background:var(--cream); color:var(--ink); border:none;
         border-radius:16px; padding:clamp(6px,1vh,10px) 8px; font-family:inherit; font-weight:900;
         font-size:clamp(11px,1.7vh,13.5px); line-height:1.15; display:flex; align-items:center;
         justify-content:center; gap:8px; box-shadow:0 4px 0 var(--creamD), 0 6px 10px rgba(0,0,0,.28);
         transition:transform .06s; }
  .big i { font-style:normal; font-size:clamp(17px,2.9vh,22px); line-height:1; }
  .big span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .big .sw { flex:0 0 auto; font-size:clamp(13px,2.1vh,16px); opacity:.42; margin-left:-2px; }
  .big:active { transform:translateY(3px); box-shadow:0 1px 0 var(--creamD); }
  .big:disabled { opacity:.5; box-shadow:0 4px 0 var(--creamD); }
  #vehBtn.alt { background:linear-gradient(180deg,#ffdd77,var(--gold));
                box-shadow:0 4px 0 var(--goldD), 0 6px 10px rgba(0,0,0,.28); }

  #padrow { display:flex; align-items:center; gap:8px; }
  #padrow #pad { flex:1 1 auto; }
  .corner { flex:0 0 auto; display:flex; flex-direction:column; gap:7px; }
  .mini { width:clamp(38px,5.6vh,46px); aspect-ratio:1; border-radius:50%; border:none; padding:0;
          background:rgba(0,0,0,.34); color:var(--cream); font-family:inherit; font-weight:900;
          font-size:clamp(15px,2.4vh,18px); display:grid; place-items:center;
          box-shadow:inset 0 0 0 2px rgba(255,255,255,.14); transition:transform .06s; }
  .mini:active { transform:scale(.92); }
  .mini:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .mini.on { background:linear-gradient(180deg,#ffdd77,var(--gold)); color:var(--ink);
             box-shadow:0 3px 0 var(--goldD); }

  /* ---------- boutons épais ---------- */
  .btn { flex:1 1 0; min-width:0; background:var(--cream); color:var(--ink); border:none;
         border-radius:14px; padding:clamp(5px,.9vh,7px) 5px clamp(6px,1vh,8px);
         font-family:inherit; font-weight:900;
         font-size:var(--fsm); line-height:1.15; box-shadow:0 4px 0 var(--creamD), 0 6px 8px rgba(0,0,0,.28);
         display:flex; flex-direction:column; align-items:center; gap:2px; transition:transform .06s; }
  .btn i { font-style:normal; font-size:clamp(13px, 2.2vh, 16px); line-height:1; }
  /* écran court : la rangée de réglages passe en icônes seules */
  @media (max-height: 720px){ .actrow.tools .btn span { display:none; }
                              .actrow.tools .btn.keep span { display:block; } }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--creamD); }
  .btn.on { background:linear-gradient(180deg,#ffdd77,var(--gold)); box-shadow:0 4px 0 var(--goldD), 0 6px 8px rgba(0,0,0,.28); }
  .btn.dark { background:var(--barkL); color:var(--cream); box-shadow:0 4px 0 rgba(0,0,0,.42); }
  .btn.wide { flex:2 1 0; }

  /* repère de zoom : sans retour visible, on ne sait pas qu'on pince */
  #zoomTag { position:fixed; z-index:9; left:50%; transform:translateX(-50%) scale(.9);
             top:calc(env(safe-area-inset-top) + 168px);
             background:rgba(14,20,14,.82); color:var(--cream); border-radius:999px;
             padding:6px 15px; font-size:13px; font-weight:900;
             font-variant-numeric:tabular-nums; opacity:0; pointer-events:none;
             transition:opacity .18s ease, transform .18s ease; }
  #zoomTag.on { opacity:1; transform:translateX(-50%) scale(1); }

  /* ---------- effets volants ---------- */
  #fx { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:6; }
  .float { position:absolute; display:flex; align-items:center; gap:6px; color:#fff; font-size:21px;
           font-weight:900; text-shadow:0 3px 0 rgba(0,0,0,.45); white-space:nowrap;
           transform:translate(-50%,-50%); will-change:transform,opacity; }
  .float .c { width:24px; height:24px; border-radius:50%;
              background:radial-gradient(circle at 34% 30%, #ffe38a, #e39b1c); border:2px solid #a86c07; }
  .fly { position:absolute; width:19px; height:19px; border-radius:50%; margin:-9px 0 0 -9px;
         background:radial-gradient(circle at 34% 30%, #ffe38a, #e39b1c); border:2px solid #a86c07;
         box-shadow:0 2px 5px rgba(0,0,0,.35); will-change:transform,opacity; }
  .conf { position:absolute; width:9px; height:14px; border-radius:2px; will-change:transform,opacity; }

  /* ---------- messages ---------- */
  #toast { position:fixed; z-index:20; left:50%; transform:translateX(-50%); top:23%;
           display:flex; flex-direction:column; align-items:center; gap:7px; pointer-events:none; }
  #toast div { background:var(--cream); color:var(--ink); border-radius:14px; padding:9px 16px;
               font-size:13px; font-weight:900; box-shadow:0 5px 0 rgba(0,0,0,.3);
               animation:tin .34s cubic-bezier(.2,1.4,.4,1); }
  #toast div.bad  { background:var(--rust); color:#fff; box-shadow:0 5px 0 var(--rustD); }
  #toast div.good { background:var(--grass); color:#fff; box-shadow:0 5px 0 var(--grassD); }
  @keyframes tin { from { opacity:0; transform:translateY(14px) scale(.9); } }

  /* ---------- manette ---------- */
  #pad { display:flex; justify-content:center; }
  #pathBtn svg{ width:52%; height:52%; }
  #pathBtn{ opacity:.45; }                       /* rien à arrêter : le bouton s'efface */
  #pathBtn.rolling{ opacity:1; background:linear-gradient(180deg,#ff8a72,var(--rust));
                    color:#fff; box-shadow:0 3px 0 var(--rustD); }
  #btnCam.free{ background:linear-gradient(180deg,#ffdd77,var(--gold)); color:var(--ink);
                box-shadow:0 3px 0 var(--goldD); }
  #padStick { display:flex; width:100%; justify-content:center; }
  body.kb #padStick { display:none; }
  @keyframes armPulse{ 0%,100%{ box-shadow:0 3px 0 var(--goldD), 0 0 0 0 rgba(255,201,60,.55); }
                       50%{ box-shadow:0 3px 0 var(--goldD), 0 0 0 10px rgba(255,201,60,0); } }
  @media (prefers-reduced-motion:reduce){ #pathBtn.armed{ animation:none; } }
  #stick { position:relative; width:clamp(78px, 13vh, 108px); aspect-ratio:1; border-radius:50%;
           background:radial-gradient(circle at 50% 38%, rgba(0,0,0,.28), rgba(0,0,0,.46));
           border:4px solid rgba(255,255,255,.22); touch-action:none;
           box-shadow:inset 0 4px 10px rgba(0,0,0,.4); }
  #knob { position:absolute; left:26%; top:26%; width:48%; height:48%;
          border-radius:50%; background:linear-gradient(180deg,#ffdd77,var(--gold));
          border:3px solid rgba(0,0,0,.32); box-shadow:0 4px 0 var(--goldD); }

  /* ---------- fenêtres ---------- */
  #ovl { position:fixed; inset:0; z-index:30; background:rgba(12,20,10,.68); display:none;
         align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(2px); }
  #ovl.on { display:flex; }
  #sheet { width:100%; max-width:430px; max-height:88vh; display:flex; flex-direction:column;
           background:var(--cream); color:var(--ink); border:4px solid #fff; border-radius:26px;
           box-shadow:0 12px 0 rgba(0,0,0,.32), 0 24px 44px rgba(0,0,0,.42); overflow:hidden;
           animation:sheetIn .3s cubic-bezier(.2,1.35,.4,1); }
  @keyframes sheetIn { from { opacity:0; transform:scale(.86) translateY(18px); } }
  #sheetHead { position:relative; display:flex; align-items:center; gap:10px; padding:13px 16px 12px;
               background:linear-gradient(180deg,#ffdd77,var(--gold)); color:var(--ink);
               font-size:19px; font-weight:900; box-shadow:0 3px 0 rgba(0,0,0,.14); }
  #sheetHead .sp { flex:1; }
  #sheetX { flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:none; font-size:16px;
            font-family:inherit; font-weight:900; background:var(--rust); color:#fff;
            box-shadow:0 3px 0 var(--rustD); display:grid; place-items:center; }
  #sheetX:active { transform:translateY(2px); box-shadow:0 1px 0 var(--rustD); }
  #tabs { display:flex; gap:6px; padding:11px 14px 4px; }
  #tabs .tab { flex:1 1 0; border:none; border-radius:13px; padding:9px 4px; font-family:inherit;
               font-weight:900; font-size:11.5px; background:var(--creamD); color:var(--inkSoft);
               box-shadow:0 3px 0 rgba(0,0,0,.14); }
  #tabs .tab.on { background:var(--ink); color:var(--cream); box-shadow:0 3px 0 rgba(0,0,0,.3); }
  #body { overflow-y:auto; padding:10px 14px 18px; -webkit-overflow-scrolling:touch; }

  .card { background:#fff; border-radius:18px; padding:11px; margin-bottom:9px;
          display:flex; align-items:center; gap:11px; box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .card .ic { flex:0 0 auto; width:46px; height:46px; border-radius:14px; display:grid; place-items:center;
              font-size:24px; background:var(--creamD); box-shadow:inset 0 -3px 0 rgba(0,0,0,.1); }
  .card .tx { flex:1; min-width:0; }
  .card .tx b { display:block; font-size:14.5px; }
  .card .tx span { display:block; font-size:11px; color:var(--inkSoft); margin-top:2px; line-height:1.35; }
  .card .lv { display:flex; gap:3px; margin-top:6px; }
  .card .lv i { width:16px; height:7px; border-radius:4px; background:var(--creamD); }
  .card .lv i.f { background:var(--gold); box-shadow:inset 0 -1px 0 rgba(0,0,0,.15); }
  .card.sel { background:linear-gradient(180deg,#fff8e2,#ffeeba); box-shadow:0 0 0 3px var(--gold), 0 3px 0 rgba(0,0,0,.12); }
  .card.sel .ic { background:var(--gold); }

  .buy { flex:0 0 auto; border:none; border-radius:13px; padding:10px 12px; font-family:inherit;
         font-weight:900; font-size:12px; white-space:nowrap; color:#fff;
         background:linear-gradient(180deg,#6bd06d,var(--grass)); box-shadow:0 4px 0 var(--grassD); }
  .buy:active { transform:translateY(3px); box-shadow:0 1px 0 var(--grassD); }
  .buy:disabled { background:var(--creamD); color:#b3a184; box-shadow:0 4px 0 #ddcaa4; }
  .buy.max { background:var(--creamD); color:var(--inkSoft); box-shadow:0 4px 0 #ddcaa4; }
  .buy.gold { background:linear-gradient(180deg,#ffdd77,var(--gold)); color:var(--ink); box-shadow:0 4px 0 var(--goldD); }

  .note { color:var(--inkSoft); font-size:12px; line-height:1.55; font-weight:700; margin:2px 2px 11px; }
  .note b { color:var(--ink); }
  .keys { display:grid; grid-template-columns:auto 1fr; gap:7px 11px; align-items:center;
          font-size:12.5px; background:#fff; border-radius:18px; padding:13px;
          box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .keys kbd { background:var(--ink); color:var(--cream); border-radius:8px; padding:5px 8px;
              font-family:inherit; font-size:11px; white-space:nowrap; text-align:center;
              box-shadow:0 2px 0 rgba(0,0,0,.35); }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:11px; }
  .stats div { background:#fff; border-radius:16px; padding:10px 12px; box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .stats b { display:block; font-size:18px; }
  .stats span { font-size:11px; color:var(--inkSoft); }

  /* passage de niveau */
  #sheet.party { border-color:var(--gold); }
  .party-head { background:linear-gradient(180deg,var(--plum),var(--plumD)) !important; color:#fff !important; }
  .prize { text-align:center; background:#fff; border-radius:20px; padding:20px 14px;
           box-shadow:0 3px 0 rgba(0,0,0,.12); margin-bottom:11px; }
  .prize .big { display:flex; align-items:center; justify-content:center; gap:11px;
                font-size:40px; font-weight:900; letter-spacing:-1px; }
  .prize .big .c { width:44px; height:44px; border-radius:50%;
                   background:radial-gradient(circle at 34% 30%, #ffe38a, #e39b1c); border:3px solid #a86c07; }
  .prize p { color:var(--inkSoft); font-size:12.5px; margin-top:7px; }
  .full-btn { width:100%; padding:14px; font-size:15px; border-radius:16px; }
</style>
</head>
<body>
<div id="ui">
  <header id="top">
    <div class="chips">
      <div class="chip c-gold" id="chipCoins"><span class="tok">🪙</span><b id="coins">0</b></div>
      <div class="chip c-wheat"><span class="tok">🌾</span><b id="stock">0</b><em>t</em></div>
      <div class="chip c-sky"><span class="tok" id="wIcon">☀️</span><b id="clock">08:00</b></div>
      <div class="chip c-lvl" id="chipLvl"><span class="tok">⭐</span><b id="lvl">1</b></div>
    </div>
    <div id="steps"></div>
    <div id="gaugerow">
      <div id="gauge"><i></i><span id="gval">0 %</span></div>
    </div>
    <div id="contract"></div>
  </header>

  <div id="stage"><div id="app"></div></div>

  <footer id="bot">
    <div id="mainrow">
      <button class="big" id="vehBtn"><i>🌾</i><span>Moissonneuse</span></button>
      <button class="big" id="cropBtn"><i>🌾</i><span>Blé</span></button>
    </div>
    <div id="padrow">
      <div class="corner">
        <button class="mini" id="btnShop" aria-label="Boutique">🛒</button>
        <button class="mini" id="pathBtn" aria-label="Arrêter l'engin">
          <svg id="icoStop" viewBox="0 0 44 44" aria-hidden="true">
            <rect x="13" y="13" width="18" height="18" rx="3" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div id="pad">
        <div id="padStick"><div id="stick"><div id="knob"></div></div></div>
      </div>
      <div class="corner">
        <button class="mini" id="btnCam" aria-label="Recentrer sur l'engin">🎯</button>
        <button class="mini" id="btnSet" aria-label="Réglages">⚙️</button>
      </div>
      <div class="corner">
        <button class="mini" id="btnAuto" aria-label="Pilote automatique">🤖</button>
        <button class="mini" id="btnSpeed" aria-label="Vitesse du temps">×1</button>
      </div>
    </div>

<script src="vendor/three.min.js"></script>
<script>
(function(){
"use strict";

const C = {
  red:'#d63a29', redDark:'#9e2618', green:'#2f8f3d', greenDark:'#1b6528',
  blue:'#2f6fae', blueDark:'#1d4a7a', orange:'#ef7f1f', orangeDark:'#b85c10',
  cream:'#e9e2cd', glass:'#12171d', metal:'#b6bec6', steel:'#7d8891',
  dark:'#1c2127', tire:'#15181c', tread:'#2a3038',
  gold:'#efb833', goldDark:'#b98a1c', lamp:'#ffe9a8', beacon:'#ff7a18',
  barn:'#b23a2c', siloC:'#cfc9b8', roof:'#2c333c', trunk:'#6b4a2c', leaf:'#3f8a28',
  stemY:'#7fb03c', stemD:'#a8a94a', headY:'#8fc04a', headR:'#e6bf52'
};

const app = document.getElementById('app'), fx = document.getElementById('fx');
const stageEl = document.getElementById('stage');
let SW = 1, SH = 1, SX = 0, SY = 0;      // rectangle de l'aire de jeu, en pixels écran
const scene = new THREE.Scene();
scene.background = new THREE.Color('#54a52e');

// ---------- caméra : même angle qu'avant, mais elle suit l'engin (le terrain ne tient plus à l'écran)
let PITCH = 50*Math.PI/180;   // inclinaison de la caméra, réglable à deux doigts
let VIEW = 34;      // hauteur de monde visible au point visé
// Caméra en perspective. En projection orthogonale, incliner la caméra ne changeait que
// l'écrasement du sol : les bâtiments et les engins gardaient la même taille au premier
// plan comme au fond, et rien ne fuyait. Une ouverture de 34° donne la fuite qu'on attend
// d'une vue inclinée, sans déformer les bords comme le ferait un grand angle.
const FOV = 34;
const camera = new THREE.PerspectiveCamera(FOV, 1, 1, 400);
let camDist = 150;                      // reculée pour cadrer VIEW mètres au point visé
const camOff = new THREE.Vector3();
function applyPitch(){
  const h = camDist*Math.sin(PITCH), r = camDist*Math.cos(PITCH);
  camOff.set(Math.sin(YAW)*r, h, Math.cos(YAW)*r);
}
const camLook = new THREE.Vector3(0,1,0);   // point visé
// La carte se manipule au doigt : deux doigts la déplacent, l'écartement la zoome. Elle
// cesse alors de suivre l'engin — c'est voulu, on va regarder ailleurs — et une pastille
// permet de revenir dessus.
// La caméra ne suit plus personne : elle reste où on l'a laissée. Deux doigts la
// déplacent, l'écartement la zoome, la torsion la fait tourner autour de son point visé.
let YAW = 0;
function camFollow(){ const v = pilote(); if (v) camLook.set(v.pos.x, 1, v.pos.z); }
function camPan(dx, dz){
  camLook.x = Math.max(X0-60, Math.min(X0+P+60, camLook.x + dx));
  camLook.z = Math.max(Z0-60, Math.min(Z0+P+70, camLook.z + dz));
}
function setYaw(a){ YAW = a; applyPitch(); }
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);
let zoom = 1.25;                        // facteur de rapprochement, piloté à deux doigts
function applyCamera(){
  const a = SW/SH;
  VIEW = Math.max(26, Math.min(50, SH/10.5));
  VIEW = Math.min(VIEW, 86/a) / zoom;   // écran très large : on ne montre pas toute la ferme d'un coup
  // le recul se déduit du cadrage voulu : au point visé, on voit toujours VIEW mètres
  camDist = (VIEW/2) / Math.tan(FOV*Math.PI/360);
  camera.aspect = a;
  camera.near = Math.max(.5, camDist*.04);
  camera.far  = camDist + 320;
  camera.updateProjectionMatrix();
  applyPitch();
}
function resize(){
  const r = stageEl.getBoundingClientRect();
  SW = Math.max(1, Math.round(r.width)); SH = Math.max(1, Math.round(r.height));
  SX = r.left; SY = r.top;
  applyCamera(); renderer.setSize(SW, SH);
}
let _zTag = null, _zHide = 0;
function showTag(txt){
  if (!_zTag) _zTag = document.getElementById('zoomTag');
  _zTag.textContent = txt;
  _zTag.classList.add('on');
  clearTimeout(_zHide);
  _zHide = setTimeout(() => _zTag.classList.remove('on'), 900);
}
function setZoom(z){
  const nz = Math.max(.45, Math.min(3.2, z));
  if (Math.abs(nz - zoom) < 1e-4) return;
  zoom = nz; applyCamera();
  showTag('🔍 ×' + zoom.toFixed(2).replace('.', ','));
}
// balayage vertical à deux doigts : la caméra se redresse ou se couche vers l'horizon
function setPitch(rad){
  const np = Math.max(28*Math.PI/180, Math.min(85*Math.PI/180, rad));
  if (Math.abs(np - PITCH) < 1e-4) return;
  PITCH = np; applyPitch();
  showTag('📐 ' + Math.round(PITCH*180/Math.PI) + '°');
}
resize(); addEventListener('resize', resize);
// les bandeaux changent de hauteur (contrat affiché, manette masquée) : on suit la scène
if (window.ResizeObserver) new ResizeObserver(resize).observe(stageEl);

// ---------- les doigts ----------
// Tout passe par un seul gestionnaire, posé plus bas avec le reste des commandes. Deux
// jeux d'écouteurs sur le même élément se marchaient dessus : l'un capturait le premier
// doigt, l'autre attendait le second, et le pincement ne partait pas une fois sur deux.
// Ici on ne garde que le registre partagé et la molette.
const TOUCH = new Map();
const pinching = () => TOUCH.size >= 2;
stageEl.addEventListener('wheel', e => {       // à la souris, la molette fait le même office
  e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.12 : 1/1.12));
}, { passive:false });

const hemi = new THREE.HemisphereLight('#ffffff','#4e8a34',.88);   // lumière plate comme la réf
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff6de',.5);
const sunAt = new THREE.Vector3(0,0,0);      // le point que le soleil suit, en douceur
sun.castShadow = true; sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,near:1,far:110});
scene.add(sun, sun.target);

// ---------- matériaux ----------
// ---------- le filtre ----------
// Un voile de matière, deux fois plus discret que le premier essai : la couleur est un peu
// plus dense là où l'outil a repassé, un peu plus claire ailleurs, avec le grain du papier
// par-dessus. Les engins en reçoivent un peu plus, et un cran de saturation en prime pour
// qu'ils restent vifs devant le terrain.
const GOU_FN = `
  varying vec2 vGouP;
  float gouH(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453123); }
  float gouN(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(gouH(i), gouH(i+vec2(1.0,0.0)), u.x),
               mix(gouH(i+vec2(0.0,1.0)), gouH(i+vec2(1.0,1.0)), u.x), u.y);
  }`;
// monde : le motif est fixé au terrain, il ne glisse pas quand la caméra bouge.
// objet : le motif est peint sur la pièce, il la suit — c'est ce qu'il faut pour un engin.
function gouache(m, force, monde, vif){
  const a = (force === undefined ? 1 : force).toFixed(3);
  const sat = (vif === undefined ? 1 : vif).toFixed(3);
  const src = monde
    ? `#ifdef USE_INSTANCING
         vec4 gouW = modelMatrix * instanceMatrix * vec4(transformed, 1.0);
       #else
         vec4 gouW = modelMatrix * vec4(transformed, 1.0);
       #endif
       vGouP = gouW.xz + gouW.y*vec2(0.63,-0.47);`
    : `vGouP = position.xz + position.y*vec2(0.71,-0.53);`;
  return chainCompile(m, sh => {
    sh.vertexShader = 'varying vec2 vGouP;\n' + sh.vertexShader.replace(
      '#include <begin_vertex>', '#include <begin_vertex>\n' + src);
    sh.fragmentShader = GOU_FN + '\n' + sh.fragmentShader.replace(
      '#include <color_fragment>',
      `#include <color_fragment>
       {
         vec2 gp = vGouP * 1.15;
         float gl1 = gouN(gp*0.42), gl2 = gouN(gp*1.35), gl3 = gouN(gp*6.5);
         float lav = (gl1*0.5 + gl2*0.34 + gl3*0.16) - 0.5;
         diffuseColor.rgb *= 1.0 + lav * 0.34 * ${a};
         float dep = smoothstep(0.60, 0.95, gouN(gp*0.72 + 11.3));
         diffuseColor.rgb *= 1.0 - dep * 0.09 * ${a};
         float lum = dot(diffuseColor.rgb, vec3(0.299, 0.587, 0.114));
         diffuseColor.rgb = clamp(mix(vec3(lum), diffuseColor.rgb, ${sat}), 0.0, 1.0);
       }`);
  }, 'gou' + a + '/' + sat + '/' + (monde ? 'monde' : 'objet'));
}
// Un patch de shader peut en cacher un autre : on les enchaîne au lieu de les écraser.
// three range ses programmes compilés par le TEXTE de onBeforeCompile. Nos patchs enchaînés
// ont tous le même texte — celui de la fonction ci-dessous — si bien que deux matériaux aux
// réglages pourtant différents tombaient sur la même case et se repassaient le shader du
// premier arrivé. Chaque patch ajoute donc sa signature à celle du matériau.
function chainCompile(m, fn, cle){
  const prev = m.onBeforeCompile;
  m.onBeforeCompile = s => { if (prev) prev(s); fn(s); };
  const base = m.__cle !== undefined ? m.__cle : (prev ? prev.toString() : '');
  const k = m.__cle = base + '|' + (cle || fn.toString());
  m.customProgramCacheKey = () => k;
  m.needsUpdate = true;
  return m;
}
const matS = {}, matJ = {}, geoC = {};
const UJ = { bend:{value:new THREE.Vector3()}, h:{value:4.5} };
let JELLY = false;
function jelly(m){
  m.onBeforeCompile = s => {
    s.uniforms.uBend = UJ.bend; s.uniforms.uJH = UJ.h;
    s.vertexShader = 'uniform vec3 uBend;uniform float uJH;\n' + s.vertexShader.replace(
      '#include <fog_vertex>',
      `#include <fog_vertex>
       vec4 jw = modelMatrix * vec4(transformed, 1.0);
       float jk = clamp(jw.y/uJH, 0.0, 1.0); jk *= jk;
       float tw = 0.72 + 0.5*sin(jw.x*.7 + jw.z*.45);
       gl_Position = projectionMatrix * viewMatrix * vec4(jw.xyz + uBend*jk*tw, 1.0);`);
  };
  return m;
}
function mat(c){
  const T = JELLY ? matJ : matS;
  if (T[c]) return T[c];
  const m = new THREE.MeshLambertMaterial({color:c});
  if (JELLY) jelly(m);
  return T[c] = gouache(m, .6, false, 1.16);   // peint sur la pièce, et un rien plus vif
}
function rrShape(w,h,r){
  const s = new THREE.Shape(), x=-w/2, y=-h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
const ROUND = .40;
function rboxGeo(w,h,d,r){
  r = Math.min(r, w/2.6, h/2.6, d/2.6);
  const k = [w,h,d,r].map(v=>v.toFixed(3)).join('|');
  if (geoC[k]) return geoC[k];
  const sw=w-2*r, sh=h-2*r;
  const g = new THREE.ExtrudeGeometry(rrShape(sw,sh,Math.min(r*1.4,Math.min(sw,sh)/2.3)),
    { depth:Math.max(.002,d-2*r), bevelEnabled:true, bevelThickness:r, bevelSize:r,
      bevelSegments:2, curveSegments:3, steps:1 });
  g.center();
  g.userData.shared = true;          // mise en cache : elle survit aux engins qui l'utilisent
  return geoC[k] = g;
}
function rbox(w,h,d,col,x,y,z,p,r){
  const m = new THREE.Mesh(rboxGeo(w,h,d,(r===undefined?.12:r)*ROUND), mat(col));
  m.position.set(x,y,z); m.castShadow = true; (p||scene).add(m); return m;
}
function cyl(rt,rb,h,s,col,x,y,z,p){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s), mat(col));
  m.position.set(x,y,z); m.castShadow = true; (p||scene).add(m); return m;
}

// ---------- pièces d'engin ----------
let beacons = [];
function beacon(x,y,z,p){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(.1,.13,.24,8),
    jelly(new THREE.MeshLambertMaterial({ color:C.beacon, emissive:new THREE.Color(0,0,0) })));
  m.material.userData.own = true;
  m.position.set(x,y,z); m.castShadow = true; p.add(m); beacons.push(m); return m;
}
let brakeLights = [];
function tail(w,y,z,p){                                  // feux rouges + stop à l'arrière
  rbox(w*.9,.2,.12, C.dark, 0,y,z, p, .05);
  [1,-1].forEach(k => {
    const m = new THREE.Mesh(rboxGeo(.34,.2,.1,.03),
      jelly(new THREE.MeshLambertMaterial({ color:'#c22a1e', emissive:new THREE.Color(0,0,0) })));
    m.material.userData.own = true;
    m.position.set(k*w*.3, y, z-.04); m.castShadow = true; p.add(m); brakeLights.push(m);
  });
}
let headlamps = [];
function lamps(w,y,z,p){
  rbox(w*.92,.34,.16, C.dark, 0,y-.05,z, p, .06);
  [1,-1].forEach(k => {                                  // phares : allumés au crépuscule
    const m = new THREE.Mesh(rboxGeo(.3,.19,.1,.04*ROUND),
      jelly(new THREE.MeshLambertMaterial({ color:C.lamp, emissive:new THREE.Color(0,0,0) })));
    m.material.userData.own = true;
    m.position.set(k*w*.3, y, z+.05); m.castShadow = true; p.add(m); headlamps.push(m);
  });
}
function glazing(w,h,d,col,x,y,z,p){
  rbox(w+.07,h,d+.07, C.glass, x,y,z, p, .05);          // toutes les faces vitrées, noires
  const t = .13, hh = h+.07;
  [[w/2,d/2],[-w/2,d/2],[w/2,-d/2],[-w/2,-d/2],[w/2,0],[-w/2,0]]
    .forEach(([dx,dz]) => rbox(t,hh,t, col, x+dx, y, z+dz, p, .02));
  rbox(.19,hh,.19, col, x, y, z+d/2, p, .02);           // montant central AVANT : 2 vitres
  rbox(.15,hh,.15, col, x, y, z-d/2, p, .02);           // montant central arrière
  rbox(w+.19,.12,.12, col, x, y+h/2, z+d/2, p, .03);    // cadre haut de pare-brise
  rbox(w+.19,.12,.12, col, x, y-h/2, z+d/2, p, .03);    // cadre bas
  rbox(w+.18,.11,d+.18, col, x, y-h/2, z, p, .03);      // ceinture basse
}
function door(h,d,col,x,y,z,p,s){          // la porte couvre tout le bloc vitré latéral
  rbox(.09, h*.46, d, col, x+s*.045, y-h*.26, z, p, .04);        // panneau bas pleine longueur
  rbox(.11, h, .11, col, x+s*.055, y, z-d/2, p, .02);            // montant arrière
  rbox(.11, h, .11, col, x+s*.055, y, z+d/2, p, .02);            // montant avant
  rbox(.1, .1, d, col, x+s*.055, y+h/2, z, p, .02);              // traverse haute
  rbox(.09,.11,.34, C.metal, x+s*.07, y-h*.03, z+d*.26, p, .02); // poignée
}
function mirrors(w,y,z,p,col){
  [1,-1].forEach(s => {
    rbox(.06,.06,.5, col, s*(w/2+.24), y, z+.2, p, .02);
    rbox(.12,.34,.1, C.dark, s*(w/2+.42), y-.06, z+.42, p, .03);
  });
}
function ladder(h,x,y,z,p){
  rbox(.07,h,.07, C.metal, x,y,z-.16, p, .02);
  rbox(.07,h,.07, C.metal, x,y,z+.16, p, .02);
  for(let i=0;i<3;i++) rbox(.09,.06,.42, C.metal, x,y-h/2+.2+i*(h-.35)/2,z, p, .02);
}
function fender(w,r,x,y,z,p,col){            // aile au-dessus d'une roue
  rbox(w,.16,r*2.1, col, x,y+r*.92,z, p, .07);
  rbox(w,r*.55,.16, col, x,y+r*.62,z-r*1.0, p, .05);
  rbox(w,r*.35,.16, col, x,y+r*.74,z+r*1.0, p, .05);
}
function wheel(r,w,x,y,z,p){
  const steer = new THREE.Group(); steer.position.set(x,y,z); p.add(steer);
  const spin = new THREE.Group(); steer.add(spin);
  const tg = new THREE.CylinderGeometry(r,r,w,16); tg.rotateZ(Math.PI/2);
  const t = new THREE.Mesh(tg, mat(C.tire)); t.castShadow = true; spin.add(t);
  const hg = new THREE.CylinderGeometry(r*.42,r*.42,w+.14,12); hg.rotateZ(Math.PI/2);
  spin.add(new THREE.Mesh(hg, mat(C.cream)));
  const NL = 16, lug = new THREE.BoxGeometry(w*.94,.06,r*.2);
  for(let i=0;i<NL;i++){
    const a = i/NL*6.28318, m = new THREE.Mesh(lug, mat(C.tread));
    m.position.set(0, Math.sin(a)*(r-.015), Math.cos(a)*(r-.015));
    m.rotation.x = -a; m.castShadow = true; spin.add(m);
  }
  steer.userData.spin = spin; steer.userData.r = r;
  return steer;
}
function disc(r,x,y,z,yaw,p,col){
  const tilt = new THREE.Group(); tilt.position.set(x,y,z); tilt.rotation.y = yaw; p.add(tilt);
  const spin = new THREE.Group(); tilt.add(spin);
  const g = new THREE.CylinderGeometry(r,r,.06,12); g.rotateZ(Math.PI/2);
  const m = new THREE.Mesh(g, mat(col||C.steel)); m.castShadow = true; spin.add(m);
  tilt.userData.spin = spin; tilt.userData.r = r;
  return tilt;
}
function reel(len,r,bats,x,y,z,p,col){
  const g = new THREE.Group(); g.position.set(x,y,z); p.add(g);
  const dg = new THREE.CylinderGeometry(r*.42,r*.42,len,10); dg.rotateZ(Math.PI/2);
  g.add(new THREE.Mesh(dg, mat(C.metal)));
  for(let i=0;i<bats;i++){
    const a = i/bats*6.28318;
    rbox(len,.46,.13,col,0,Math.sin(a)*r,Math.cos(a)*r,g,.05).rotation.x = -a;
    rbox(.1,r,.1,C.metal, len/2-.12, Math.sin(a)*r/2, Math.cos(a)*r/2, g,.03).rotation.x = -a;
    rbox(.1,r,.1,C.metal,-len/2+.12, Math.sin(a)*r/2, Math.cos(a)*r/2, g,.03).rotation.x = -a;
  }
  return g;
}
function fillBox(w,h,d,x,y,z,p){
  const wrap = new THREE.Group(); wrap.position.set(x,y,z); p.add(wrap);
  const g = new THREE.BoxGeometry(w,h,d); g.translate(0,h/2,0);
  const m = new THREE.Mesh(g, mat(C.gold)); m.castShadow = true; wrap.add(m);
  wrap.scale.y = .02; return wrap;
}

// Repliée, la vis doit longer le corps vers l'arrière — à 2,25 rad elle dépassait
// encore sur le côté, et du mauvais côté qui plus est.
const AUG_FOLD = Math.PI/2, AUG_OPEN = 0;

// ---------- engins : formes d'origine ----------
function tractorBase(g, col){
  const dk = col===C.green ? C.greenDark : C.blueDark;
  rbox(1.95,1,3.7, col, 0,1.3,.7, g, .16);
  rbox(2.05,.4,3.8, dk, 0,.82,.7, g, .12);
  rbox(2.02,.22,2.6, dk, 0,1.62,1.1, g, .05);
  rbox(1.66,1.15,1.5, col, 0,2.3,-.15, g, .16);
  glazing(1.66,.92,1.52, col, 0,2.44,-.15, g);
  door(1.15,1.5, dk, .83,2.34,-.15, g, 1); door(1.15,1.5, dk, -.83,2.34,-.15, g, -1);
  rbox(1.96,.14,1.72, C.dark, 0,2.94,-.15, g, .05);
  cyl(.12,.1,1.35,6, C.dark, .78,2.6,1.5, g);
  beacon(-.62,3.06,-.15, g);
  lamps(1.9,1.42,2.56,g);
  tail(1.95,1.32,-1.26,g);   // en saillie sur la face arrière
  // attache caravane : plaque, chapes et boule. C'est le pivot de tout ce qui est tracté.
  rbox(.66,.13,.55, C.dark, 0,.82,-1.95, g, .05);
  rbox(.15,.36,.15, C.dark,  .24,.6,-2.0, g, .04);
  rbox(.15,.36,.15, C.dark, -.24,.6,-2.0, g, .04);
  cyl(.1,.13,.14,10, C.metal, 0,.92,-2.15, g);
  const ball = new THREE.Mesh(new THREE.SphereGeometry(.14,10,8), mat(C.metal));
  ball.position.set(0,1.04,-2.15); ball.castShadow = true; g.add(ball);
  const hitch = new THREE.Group(); hitch.position.set(0,0,-2.15); g.add(hitch);   // pivot = la boule
  const w = [ wheel(1.28,.66,1.43,1.28,-.55,g), wheel(1.28,.66,-1.43,1.28,-.55,g),
              wheel(.7,.48,1.33,.7,2.35,g), wheel(.7,.48,-1.33,.7,2.35,g) ];
  return { wheels:w, steer:[{w:w[2],k:1},{w:w[3],k:1}], hitch };
}

// ---------- engins ----------
function build(kind){
  JELLY = true;
  const g = new THREE.Group();
  let d;
  if (kind === 'prep'){

// ---------- outils de dessin des motifs de sol ----------
// Tirage reproductible : le motif posé au sol est exactement celui validé au nuancier.
const TS = 256;
function rng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function cv(){
  const c = document.createElement('canvas'); c.width = c.height = TS;
  return [c, c.getContext('2d')];
}
// Tout se répète sur les bords : le motif se raccorde sans couture d'une tuile à l'autre.
function wrapDraw(x, px, py, r, fn){
  for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
    const ax = px + dx*TS, ay = py + dy*TS;
    if (ax < -r || ax > TS+r || ay < -r || ay > TS+r) continue;
    fn(ax, ay);
  }
}
function blob(x,px,py,r,col){
  x.fillStyle = col;
  wrapDraw(x,px,py,r,(ax,ay)=>{ x.beginPath(); x.arc(ax,ay,r,0,6.3); x.fill(); });
}
function glow(x,px,py,r,c0,c1){
  wrapDraw(x,px,py,r,(ax,ay)=>{
    const g = x.createRadialGradient(ax,ay,0,ax,ay,r);
    g.addColorStop(0,c0); g.addColorStop(1,c1);
    x.fillStyle = g; x.beginPath(); x.arc(ax,ay,r,0,6.3); x.fill();
  });
}
function bands(x, a){                                  // trace de rouleau, commune à tous les états
  a = a === undefined ? .05 : a;
  x.fillStyle = 'rgba(255,255,255,'+a+')'; x.fillRect(0,0,TS/2,TS);
  x.fillStyle = 'rgba(0,0,0,'+(a+.012)+')'; x.fillRect(TS/2,0,TS/2,TS);
}
// sillon ondulé, périodique sur la hauteur pour se raccorder
function furrow(x, px, col, w, amp, k, ph){
  x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'round';
  for(const dx of [-TS,0,TS]){
    x.beginPath();
    for(let y=0;y<=TS;y+=6){
      const o = Math.sin(y/TS*6.28318*k + ph)*amp + Math.sin(y/TS*6.28318*k*2.4 + ph*1.7)*amp*.35;
      x.lineTo(px + dx + o, y);
    }
    x.stroke();
  }
}
// Terre sèche : des plaques séparées par des fentes. Un germe par maille d'un réseau
// brouillé, chacun avec son propre rayon, et pour chaque pixel l'écart entre les deux plus
// proches — nul sur la fente, maximal au cœur de la plaque. Le réseau permet de ne comparer
// qu'aux germes voisins : sans lui, une texture à l'échelle de la parcelle serait hors de
// portée. `a` est le pas du réseau, donc la taille moyenne d'une plaque.
function craquelures(x, R, a, larg, fente, bombe){
  const W = x.canvas.width, H = x.canvas.height;
  const NX = Math.ceil(W/a)+5, NY = Math.ceil(H/a)+5;
  const gx = new Float32Array(NX*NY), gy = new Float32Array(NX*NY), gw = new Float32Array(NX*NY);
  for(let j=0;j<NY;j++) for(let i=0;i<NX;i++){
    const k = j*NX+i;
    gx[k] = (i-2+.5+(R()-.5)*.88)*a;
    gy[k] = (j-2+.5+(R()-.5)*.88)*a;
    gw[k] = (R()-.5)*a*.6;                     // des plaques franchement inégales
  }
  const im = x.getImageData(0,0,W,H), D = im.data;
  for(let py=0;py<H;py++){
    const cj = (py/a|0)+2;
    const j0 = Math.max(0,cj-2), j1 = Math.min(NY-1,cj+2);
    for(let px=0;px<W;px++){
      const ci = (px/a|0)+2;
      const i0 = Math.max(0,ci-2), i1 = Math.min(NX-1,ci+2);
      let d1 = 1e9, d2 = 1e9;
      for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
        const k = j*NX+i, ux = px-gx[k], uy = py-gy[k];
        const d = Math.sqrt(ux*ux+uy*uy) - gw[k];
        if (d < d1){ d2 = d1; d1 = d; } else if (d < d2) d2 = d;
      }
      const k2 = Math.sqrt(Math.min(1, (d2-d1)/larg));
      const mul = (1 - (1-k2)*fente) * (1 + k2*bombe);
      const o = (py*W + px)*4;
      D[o]   = Math.min(255, D[o]  *mul);
      D[o+1] = Math.min(255, D[o+1]*mul);
      D[o+2] = Math.min(255, D[o+2]*mul);
    }
  }
  x.putImageData(im, 0, 0);
}
function speck(x, R, n, cols, rmin, rmax){
  for(let i=0;i<n;i++)
    blob(x, R()*TS, R()*TS, rmin + R()*(rmax-rmin), cols[(R()*cols.length)|0]);
}
// brin couché : retracé aux neuf décalages pour ne pas être coupé au bord
function straw(x, R, px, py, a, L, w, col){
  x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'round';
  for(const dx of [-TS,0,TS]) for(const dy of [-TS,0,TS]){
    x.beginPath(); x.moveTo(px+dx,py+dy);
    x.lineTo(px+dx+Math.cos(a)*L, py+dy+Math.sin(a)*L); x.stroke();
  }
}

// ---------- terrain ----------
// petit relief de terrain : le sol n'est plus un plan parfait
function groundH(x,z){
  return (Math.sin(x*.68 + z*.31)*.5 + Math.sin(x*.23 - z*.59)*.34
        + Math.sin((x+z)*1.11)*.16) * .055;
}
const P = 44, NS = 256, CS = P/NS;                 // cellules de 17 cm : le passage a un bord net
const X0 = -P/2, Z0 = -P/2 - 6, YARD = Z0 + P + 9;
const cell = new Uint8Array(NS*NS);           // état du sol : logique seule, plus aucun rendu par texture
function cellIndex(x,z){
  const ix = Math.floor((x-X0)/CS), jz = Math.floor((z-Z0)/CS);
  if (ix<0||jz<0||ix>=NS||jz>=NS) return -1;
  return jz*NS+ix;
}
const cellN = [NS*NS, 0, 0, 0];               // combien de cellules dans chaque état
function setCell(i,s2){
  if (i<0 || cell[i]===s2) return false;
  cellN[cell[i]]--; cellN[s2]++; cell[i] = s2; return true;
}
function fillCells(s2){ cell.fill(s2); for(let k=0;k<4;k++) cellN[k] = k===s2 ? NS*NS : 0; }

// ---------- la parcelle : un bloc de terre en surépaisseur, ni plat ni rectiligne ----------
// Le sol du champ domine l'herbe d'une vingtaine de centimètres : les engins y montent
// pour de vrai. Le bord n'est pas une arête droite mais une découpe crantée, et le dessus
// ondule sur deux échelles avec des mottes posées dessus.
const LIP = .22;                                       // surépaisseur de la terre
function soilBump(x,z){                                // le relief propre à la parcelle
  return Math.sin(x*.41 + z*.23)*.055
       + Math.sin(x*.19 - z*.47)*.042
       + Math.sin((x+z)*.83)*.024
       + Math.sin(x*1.63)*Math.sin(z*1.49)*.032
       + Math.sin(x*2.71 + z*1.9)*.017 + Math.sin(z*2.53 - x*1.7)*.015;
}
// Le bord se dessine par harmoniques, de la grande ondulation au petit accident.
// Un terme en marche d'escalier donnait des crans énormes et anguleux : ici tout est continu,
// et c'est la finesse du maillage qui décide du détail visible.
function edgeWob(t, seed){                             // écart du bord, en mètres
  return Math.sin(t*.29 + seed)*.30
       + Math.sin(t*.73 - seed*1.7)*.17
       + Math.sin(t*1.61 + seed*2.1)*.085
       + Math.sin(t*3.37 - seed*.9)*.042
       + Math.sin(t*6.9  + seed*3.1)*.018;
}
// Le maillage épouse le bord au lieu de jeter les cellules qui dépassent : on déforme
// le carré paramétrique près de ses côtés, donc plus aucune marche d'escalier.
const EW = .09;                                        // part du côté touchée par la déformation
const smooth3 = k => k*k*(3-2*k);
function parcelPoint(u,v){
  const bx = X0 + u*P, bz = Z0 + v*P;
  const fl = Math.max(0, 1 - u/EW),     fr = Math.max(0, 1 - (1-u)/EW);
  const fb = Math.max(0, 1 - v/EW),     ft = Math.max(0, 1 - (1-v)/EW);
  return [ bx - smooth3(fl)*edgeWob(bz, 0.7) + smooth3(fr)*edgeWob(bz, 2.9),
           bz - smooth3(fb)*edgeWob(bx, 4.1) + smooth3(ft)*edgeWob(bx, 5.7) ];
}
// distance signée au bord découpé : > 0 dedans
function parcelInset(x,z){
  const l = x - (X0        - edgeWob(z, 0.7));
  const r = (X0 + P + edgeWob(z, 2.9)) - x;
  const b = z - (Z0        - edgeWob(x, 4.1));
  const t = (Z0 + P + edgeWob(x, 5.7)) - z;
  return Math.min(l, r, b, t);
}
// hauteur du dessus de la terre : 0 sur l'herbe, la rampe de bord fait monter l'engin
function parcelY(x,z){
  const d = parcelInset(x,z);
  if (d <= 0) return 0;
  const k = Math.min(1, d/1.15), sm = k*k*(3-2*k);
  return (LIP + soilBump(x,z)) * sm;
}
// « Chaume clair » : le seul et même dessin pour le sol de départ et pour ce que la
// moissonneuse laisse derrière elle. Les deux doivent se superposer sans se distinguer,
// donc une seule recette, une seule graine, et la même échelle au sol.
// Chaque brin portait son ombre : à trois cents brins cela faisait autant de mouchetures
// sombres et le champ paraissait sali. Le relief se rend maintenant par quatre tons de
// paille, du plus clair au plus mat, sans aucun trait sombre.
// Pas de bandes de rouleau non plus : sur une surface aussi large leur couture se lisait
// d'un bout à l'autre du champ.
const CUT_TONS = ['#f6e59d', '#e6d089', '#cdb271', '#b39c64'];
const COUPE = [
  // 0 — chaume moyen : la référence
  (x,R) => { x.fillStyle='#ab9862'; x.fillRect(0,0,TS,TS);
    speck(x,R,110,['rgba(214,199,150,.34)','rgba(186,170,118,.3)'],2.5,7);
    for(let i=0;i<260;i++){ const px=R()*TS, py=R()*TS, a=R()*6.28, L=10+R()*20, w=3.6+R()*3;
      straw(x,R,px,py,a,L,w,CUT_TONS[(R()*CUT_TONS.length)|0]); } },
  // 1 — chaume dru : brins plus courts, deux fois plus nombreux, la terre ne se voit plus
  (x,R) => { x.fillStyle='#b09d66'; x.fillRect(0,0,TS,TS);
    speck(x,R,90,['rgba(220,206,158,.30)'],2.4,6.4);
    for(let i=0;i<470;i++){ const px=R()*TS, py=R()*TS, a=R()*6.28, L=7+R()*13, w=3.2+R()*2.6;
      straw(x,R,px,py,a,L,w,CUT_TONS[(R()*CUT_TONS.length)|0]); } },
  // 2 — chaume clairsemé : brins longs bien détachés, on voit la terre entre eux
  (x,R) => { x.fillStyle='#a08a58'; x.fillRect(0,0,TS,TS);
    speck(x,R,130,['rgba(200,182,134,.30)','rgba(140,120,78,.26)'],2.6,7.4);
    for(let i=0;i<150;i++){ const px=R()*TS, py=R()*TS, a=R()*6.28, L=16+R()*26, w=4+R()*3.4;
      straw(x,R,px,py,a,L,w,CUT_TONS[(R()*CUT_TONS.length)|0]); } }
];
function drawCut(x, R){ COUPE[SOL.coupe % COUPE.length](x, R); }
// ---------- recettes de sol ----------
// Chaque état de la terre a plusieurs dessins possibles, qu'on compare en jeu, tracteur
// dessus, avant d'en garder un. On change de recette en changeant un chiffre ici.
const SOL = { repos:2, prep:0, seme:0, engrais:0, coupe:0 };

// La terre au repos : celle du premier lancement, et celle qu'on retrouve après chaque
// cycle quand plus aucun passage ne la couvre. Sèche, et fendue par le soleil.
// Elle ne se répète pas : une seule image couvre toute la parcelle. Une tuile de 2,9 m
// donnait quinze répétitions en travers du champ, et des fentes de cette taille-là se
// lisaient alors comme un quadrillage. Tout est donc mesuré en mètres.
const SOLPX = 13;                                   // pixels par mètre de la grande image
const SOLN  = Math.round(P*SOLPX);
function solCanvas(){
  const c = document.createElement('canvas'); c.width = c.height = SOLN;
  return [c, c.getContext('2d'), SOLPX];
}
const pois = (x,px,py,r,col) => { x.fillStyle = col; x.beginPath(); x.arc(px,py,r,0,6.3); x.fill(); };
function sable(x, R, n, cols, rmin, rmax){         // moucheté simple, sans raccord de tuile
  for(let i=0;i<n;i++) pois(x, R()*SOLN, R()*SOLN, rmin+R()*(rmax-rmin), cols[(R()*cols.length)|0]);
}
const REPOS = [
  // 0 — fendillée fine : de petites plaques, des fentes étroites
  (x,R,S) => { x.fillStyle='#b09a6a'; x.fillRect(0,0,SOLN,SOLN);
    sable(x,R,2600,['rgba(206,190,146,.30)','rgba(150,131,90,.26)'],.16*S,.42*S);
    craquelures(x,R,.95*S,.17*S,.32,.06); },
  // 1 — grandes plaques : peu de dalles, fentes larges et franches
  (x,R,S) => { x.fillStyle='#b39a63'; x.fillRect(0,0,SOLN,SOLN);
    sable(x,R,1900,['rgba(212,194,146,.28)','rgba(146,124,80,.24)'],.18*S,.48*S);
    craquelures(x,R,2.6*S,.44*S,.48,.11); },
  // 2 — sèche et poussiéreuse : fentes moyennes, poussière claire et petits cailloux
  (x,R,S) => { x.fillStyle='#ac9767'; x.fillRect(0,0,SOLN,SOLN);
    craquelures(x,R,1.6*S,.30*S,.40,.08);
    sable(x,R,3600,['rgba(224,211,170,.30)','rgba(126,107,70,.22)'],.15*S,.45*S);
    for(let i=0;i<620;i++){ const px=R()*SOLN, py=R()*SOLN, r=(.12+R()*.16)*S;
      pois(x,px+r*.4,py+r*.4,r,'rgba(60,46,24,.32)'); pois(x,px,py,r,'#c9b891'); } },
  // 3 — dalles bombées : le relief se lit, chaque plaque a son ombre
  (x,R,S) => { x.fillStyle='#ad9764'; x.fillRect(0,0,SOLN,SOLN);
    sable(x,R,1500,['rgba(206,188,142,.24)'],.20*S,.50*S);
    craquelures(x,R,2.1*S,.38*S,.54,.20); },
  // 4 — à peine fendue, encore un peu de chaume clair par-dessus
  (x,R,S) => { x.fillStyle='#b6a273'; x.fillRect(0,0,SOLN,SOLN);
    craquelures(x,R,1.25*S,.15*S,.24,.05);
    for(let i=0;i<2600;i++){ const px=R()*SOLN, py=R()*SOLN, a=R()*6.28,
        L=(.6+R()*1.1)*S, w=(.22+R()*.18)*S, col=CUT_TONS[(R()*CUT_TONS.length)|0];
      x.strokeStyle=col; x.lineWidth=w; x.lineCap='round';
      x.beginPath(); x.moveTo(px,py); x.lineTo(px+Math.cos(a)*L, py+Math.sin(a)*L); x.stroke(); } }
];
function soilTex(){
  const [c,x,S] = solCanvas();
  REPOS[SOL.repos % REPOS.length](x, rng(1028679), S);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.repeat.set(2.9/P, 2.9/P);                       // l'uv de la parcelle compte en tuiles de 2,9 m
  return t;
}
(function parcelle(){
  const N = 220, W = N+1;                              // ~20 cm le long du bord : le contour lisse à l'œil
  const pos = [], uvs = [], col = [], tri = [];
  const px = new Float32Array(W*W), pz = new Float32Array(W*W), idx = new Int32Array(W*W);
  const push = (x,y,z,shade) => {
    pos.push(x,y,z); uvs.push((x-X0)/2.9, (z-Z0)/2.9); col.push(shade,shade,shade);
    return pos.length/3 - 1;
  };
  for(let j=0;j<=N;j++) for(let i=0;i<=N;i++){
    const k = j*W+i, p = parcelPoint(i/N, j/N), y = parcelY(p[0], p[1]);
    px[k] = p[0]; pz[k] = p[1];
    // creux à peine plus sombres, bosses à peine plus claires : le relief se devine
    // sans peindre de grandes taches brunes sur le chaume
    idx[k] = push(p[0], y, p[1], .95 + (y - LIP)*.8);
  }
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){
    const a = j*W+i, b = a+1, c = a+W, d = c+1;
    tri.push(idx[a], idx[c], idx[b], idx[b], idx[c], idx[d]);
  }
  // jupe : les quatre bords descendent sous l'herbe, c'est ce qui donne l'épaisseur
  // La tranche est presque verticale : elle ne reçoit quasiment pas de lumière et se
  // dessinait en liseré noir tout autour du champ. On l'éclaircit franchement et on la
  // raccourcit, pour qu'elle ne soit qu'un bord de terre, pas un contour d'encre.
  const skirt = (k1,k2) => {
    const t1 = push(px[k1], parcelY(px[k1],pz[k1]), pz[k1], 1.02);
    const t2 = push(px[k2], parcelY(px[k2],pz[k2]), pz[k2], 1.02);
    const b1 = push(px[k1], -.035, pz[k1], .86);
    const b2 = push(px[k2], -.035, pz[k2], .86);
    tri.push(t1,b1,t2, t2,b1,b2);
  };
  for(let i=0;i<N;i++){
    skirt(i+1, i);                                     // v = 0
    skirt(N*W+i, N*W+i+1);                             // v = 1
    skirt(i*W, (i+1)*W);                               // u = 0
    skirt((i+1)*W+N, i*W+N);                           // u = 1
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uvs,2));
  geo.setAttribute('color',    new THREE.Float32BufferAttribute(col,3));
  geo.setIndex(tri);
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({
    map:soilTex(), vertexColors:true, side:THREE.DoubleSide }));
  gouache(m.material, .42, true);
  m.receiveShadow = true; m.renderOrder = -11; scene.add(m);
})();
// mottes : de petits volumes posés sur la terre, plus denses près des bords
function semerMottes(){
  const clods = [], cg = new THREE.SphereGeometry(1, 6, 4);
  for(let i=0;i<260;i++){
    const x = X0 + Math.random()*P, z = Z0 + Math.random()*P;
    const d = parcelInset(x,z);
    if (d <= .25) continue;
    if (d > 2.4 && Math.random() > .3) continue;
    const r = .10 + Math.random()*.19;
    const m = MX(x, parcelY(x,z) + r*.28, z, 0, Math.random()*3, 0, 1);
    m.scale(new THREE.Vector3(r*1.5, r*.6, r*1.25));
    clods.push({ g:cg, c: Math.random()>.5 ? '#8f7c4c' : '#6f5f38', m });
  }
  if (!clods.length) return;
  const cm = new THREE.Mesh(merge(clods), new THREE.MeshLambertMaterial({ vertexColors:true }));
  cm.castShadow = true; cm.receiveShadow = true; scene.add(cm);
}

// ---------- traînées de passage : un ruban continu, pas des rectangles bout à bout ----------
// (des quads successifs faisaient un bord en dents de scie dans les courbes : ici les sommets
//  sont partagés d'un échantillon au suivant, le bord est une polyligne lisse)
// Le ruban de travail était rogné sur un rectangle droit : au bout de chaque passage il
// s'arrêtait donc net, alors que la terre, elle, ondule. On le laisse déborder et c'est le
// contour réel qui le découpe, au pixel près, dans le fragment shader.
function clipToParcel(m){
  const L = X0.toFixed(3), Rr = (X0+P).toFixed(3), B = Z0.toFixed(3), T = (Z0+P).toFixed(3);
  gouache(m, .42, true);
  chainCompile(m, sh => {
    sh.vertexShader = 'varying vec3 vWP;\n' + sh.vertexShader.replace(
      '#include <fog_vertex>',
      '#include <fog_vertex>\n  vWP = (modelMatrix * vec4(transformed, 1.0)).xyz;');
    sh.fragmentShader = ('varying vec3 vWP;\n' +
      'float ewob(float t, float sd){\n' +
      '  return sin(t*.29 + sd)*.30 + sin(t*.73 - sd*1.7)*.17 + sin(t*1.61 + sd*2.1)*.085\n' +
      '       + sin(t*3.37 - sd*.9)*.042 + sin(t*6.9 + sd*3.1)*.018;\n}\n' +
      sh.fragmentShader).replace(
      '#include <clipping_planes_fragment>',
      '#include <clipping_planes_fragment>\n' +
      '  float _l = vWP.x - (' + L + ' - ewob(vWP.z, 0.7));\n' +
      '  float _r = (' + Rr + ' + ewob(vWP.z, 2.9)) - vWP.x;\n' +
      '  float _b = vWP.z - (' + B + ' - ewob(vWP.x, 4.1));\n' +
      '  float _t = (' + T + ' + ewob(vWP.x, 5.7)) - vWP.z;\n' +
      '  if (min(min(_l,_r), min(_b,_t)) <= 0.0) discard;');
  });
  return m;
}

// Les grains de semence vivent dans leur propre couche : on les pose sur la terre semée
// puis fertilisée, et on les efface dès que les pousses ont franchi une dizaine de
// centimètres — passé là, ce qu'on voit du sol, c'est le vert, plus la semence.
const GRAIN = { value: 1 };
function semis(m, tex, teinte){
  const k = (teinte === undefined ? 1 : teinte).toFixed(3);
  return chainCompile(m, sh => {
    sh.uniforms.uSemis = { value: tex };
    sh.uniforms.uGrain = GRAIN;
    sh.fragmentShader = 'uniform sampler2D uSemis;\nuniform float uGrain;\n' + sh.fragmentShader
      .replace('#include <map_fragment>', `#include <map_fragment>
       {
         vec4 gr = texture2D(uSemis, vUv);
         diffuseColor.rgb = mix(diffuseColor.rgb, gr.rgb * ${k}, gr.a * uGrain);
       }`);
  }, 'semis' + k);
}

const SWATH = (function(){
  // Une texture par état, dessinée pour être franchement distincte des autres.
  // (principe repris de Mow & Go : un motif fin déposé le long du passage, pas un aplat)
  // Les motifs se lisent à 29 px la tuile : tout est dessiné gros, sinon rien ne se voit au sol.
  function finish(c){
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    if (renderer.capabilities) t.anisotropy = renderer.capabilities.getMaxAnisotropy();
    return t;
  }

  // 1. déchaumé
  const PREP = [
    // 0 — sillons souples et grosses mottes : la référence
    (x,R) => { x.fillStyle='#7d6039'; x.fillRect(0,0,TS,TS); bands(x,.03);
      x.globalAlpha=.62;
      for(let i=0;i<5;i++) furrow(x,(i+.5)*(TS/5),'#4a3620',9,5,1,i);
      x.globalAlpha=1;
      for(let i=0;i<80;i++){ const px=R()*TS, py=R()*TS, r=4.6+R()*8.4;
        blob(x,px+r*.3,py+r*.32,r,'rgba(52,37,19,.5)');
        blob(x,px,py,r*.88,'#9d7d4d');
        blob(x,px-r*.24,py-r*.28,r*.36,'rgba(226,205,160,.4)'); }
      speck(x,R,120,['rgba(163,134,86,.5)','rgba(58,42,23,.45)'],2.3,6.4); },
    // 1 — sans sillons : de la grosse motte partout, terre franchement retournée
    (x,R) => { x.fillStyle='#755934'; x.fillRect(0,0,TS,TS); bands(x,.025);
      for(let i=0;i<130;i++){ const px=R()*TS, py=R()*TS, r=5.5+R()*10;
        blob(x,px+r*.32,py+r*.34,r,'rgba(46,32,16,.46)');
        blob(x,px,py,r*.86,R()>.5?'#a3814e':'#8d6f42');
        blob(x,px-r*.26,py-r*.3,r*.34,'rgba(228,208,164,.36)'); }
      speck(x,R,90,['rgba(58,42,23,.4)'],2.4,6.6); },
    // 2 — terre fine : émiettée menu, sillons à peine marqués
    (x,R) => { x.fillStyle='#836440'; x.fillRect(0,0,TS,TS); bands(x,.03);
      x.globalAlpha=.34;
      for(let i=0;i<7;i++) furrow(x,(i+.5)*(TS/7),'#4a3620',6,4,1,i*1.9);
      x.globalAlpha=1;
      for(let i=0;i<230;i++){ const px=R()*TS, py=R()*TS, r=2.6+R()*4.6;
        blob(x,px+r*.34,py+r*.36,r,'rgba(50,35,18,.38)');
        blob(x,px,py,r*.88,'#a08048'); }
      speck(x,R,170,['rgba(180,152,100,.4)','rgba(58,42,23,.34)'],2,5.2); }
  ];
  function texTilled(){ const [c,x] = cv(); PREP[SOL.prep % PREP.length](x, rng(601844)); return finish(c); }
  // le dessin du semis, réutilisé tel quel par l'engrais. Les rangs ont sauté : la terre
  // travaillée reste nue, les grains sont semés à la volée dans une couche à part.
  const SEME = [
    // 0 — terre nue, quelques mottes émiettées : la référence
    (x,R) => { x.fillStyle='#7d5e39'; x.fillRect(0,0,TS,TS); bands(x,.028);
      speck(x,R,150,['rgba(58,42,23,.38)','rgba(166,138,90,.35)'],2.5,6.8);
      for(let i=0;i<34;i++){ const px=R()*TS, py=R()*TS, r=3.4+R()*6.2;
        blob(x,px+r*.3,py+r*.32,r,'rgba(52,37,19,.34)');
        blob(x,px,py,r*.86,'rgba(150,122,76,.5)'); } },
    // 1 — rappuyée : lisse, roulée, à peine mouchetée. Le lit de semence propre.
    (x,R) => { x.fillStyle='#835f36'; x.fillRect(0,0,TS,TS); bands(x,.042);
      speck(x,R,90,['rgba(58,42,23,.24)','rgba(184,156,104,.30)'],2,5),
      x.globalAlpha=.20;
      for(let i=0;i<9;i++) furrow(x,(i+.5)*(TS/9),'#5a442a',4,3,1,i*1.3);
      x.globalAlpha=1; },
    // 2 — grumeleuse : mottes moyennes serrées, la terre reste vivante sous les grains
    (x,R) => { x.fillStyle='#785936'; x.fillRect(0,0,TS,TS); bands(x,.026);
      for(let i=0;i<105;i++){ const px=R()*TS, py=R()*TS, r=3+R()*5.4;
        blob(x,px+r*.32,py+r*.34,r,'rgba(48,33,16,.36)');
        blob(x,px,py,r*.86,R()>.5?'#997a49':'#8a6d40'); }
      speck(x,R,130,['rgba(58,42,23,.34)','rgba(176,148,96,.32)'],2.2,5.8); }
  ];
  function drawSown(x, R){ SEME[SOL.seme % SEME.length](x, R); }
  // les grains seuls, sur fond transparent : une couche par-dessus le semis et l'engrais,
  // qu'on efface dès que les pousses sortent de terre
  function texGrains(){
    const [c,x] = cv(), R = rng(884411);
    for(let i=0;i<100;i++){
      const gx=R()*TS, gy=R()*TS, r=4.6+R()*3.2;
      blob(x,gx+1.2,gy+1.5,r,'rgba(74,54,26,.34)');
      blob(x,gx,gy,r,'#f0dda6');
      blob(x,gx-r*.3,gy-r*.32,r*.42,'#fdf3d0');
    }
    return finish(c);
  }
  // 2. semé — grains à la volée (S2)
  function texSown(){
    const [c,x] = cv(); drawSown(x, rng(762006)); return finish(c);
  }
  // 3. fertilisé — le semis, mouillé et enrichi
  const ENGRAIS = [
    // 0 — mouillé sobre : le semis assombri, quelques flaques
    (x,R2) => { x.fillStyle='rgba(40,26,10,.5)'; x.fillRect(0,0,TS,TS);
      for(let i=0;i<20;i++) glow(x,R2()*TS,R2()*TS,24+R2()*46,'rgba(20,12,4,.35)','rgba(20,12,4,0)');
      speck(x,R2,80,['rgba(186,204,214,.2)'],1.8,4.2); },
    // 1 — détrempé : plus sombre, de vraies flaques qui accrochent la lumière
    (x,R2) => { x.fillStyle='rgba(32,20,7,.62)'; x.fillRect(0,0,TS,TS);
      for(let i=0;i<30;i++) glow(x,R2()*TS,R2()*TS,34+R2()*62,'rgba(14,9,3,.44)','rgba(14,9,3,0)');
      for(let i=0;i<12;i++) glow(x,R2()*TS,R2()*TS,16+R2()*26,'rgba(198,216,226,.26)','rgba(198,216,226,0)');
      speck(x,R2,110,['rgba(190,208,218,.24)'],2,5); },
    // 2 — engrais visible : terre à peine mouillée, granulés clairs répandus dessus
    (x,R2) => { x.fillStyle='rgba(44,30,12,.38)'; x.fillRect(0,0,TS,TS);
      for(let i=0;i<14;i++) glow(x,R2()*TS,R2()*TS,22+R2()*40,'rgba(20,12,4,.28)','rgba(20,12,4,0)');
      for(let i=0;i<150;i++){ const px=R2()*TS, py=R2()*TS, r=2.2+R2()*3;
        blob(x,px,py,r,R2()>.45?'#dfe6c8':'#c9d3a6'); }
      speck(x,R2,70,['rgba(186,204,214,.2)'],1.8,4.2); }
  ];
  function texWet(){
    const [c,x] = cv();
    drawSown(x, rng(762006));
    ENGRAIS[SOL.engrais % ENGRAIS.length](x, rng(763788));
    return finish(c);
  }
  // 4. moissonné — « Menue paille » (M5), débris nettement plus longs et plus jaunes
  function texCut(){
    const [c,x] = cv();
    drawCut(x, rng(1028679));                          // strictement le sol de départ
    return finish(c);
  }
  const TEX = [texTilled(), texSown(), texWet(), texCut()];
  const GTEX = texGrains();
  const MAXS = 6000, TILE = 2.9;          // 1 motif = 2,9 m au sol, échelle constante
  const layers = TEX.map((tex,i) => {
    const pos = new Float32Array(MAXS*6), nor = new Float32Array(MAXS*6), uv = new Float32Array(MAXS*4);
    for(let k=0;k<MAXS*2;k++){ nor[k*3]=0; nor[k*3+1]=1; nor[k*3+2]=0; }
    const idx = new Uint32Array((MAXS-1)*6);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos,3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('normal', new THREE.BufferAttribute(nor,3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv,2).setUsage(THREE.DynamicDrawUsage));
    geo.setIndex(new THREE.BufferAttribute(idx,1));
    geo.setDrawRange(0,0);
    const base = i === 2
      ? new THREE.MeshPhongMaterial({ map:tex, side:THREE.DoubleSide, shininess:38,

function merge(parts){
  const gs = parts.map(p => {
    let g = p.g.index ? p.g.toNonIndexed() : p.g.clone();
    g.applyMatrix4(p.m);
    const n = g.attributes.position.count, c = new THREE.Color(p.c), col = new Float32Array(n*3);
    for(let i=0;i<n;i++){ col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(col,3));
    return g;
  });
  const total = gs.reduce((s,g)=>s+g.attributes.position.count,0);
  const pos=new Float32Array(total*3), nor=new Float32Array(total*3), col=new Float32Array(total*3);
  let o=0;
  gs.forEach(g => {
    pos.set(g.attributes.position.array,o*3);
    nor.set(g.attributes.normal.array,o*3);
    col.set(g.attributes.color.array,o*3);
    o += g.attributes.position.count;
  });
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor,3));
  out.setAttribute('color', new THREE.BufferAttribute(col,3));
  return out;
}
const MX = (x,y,z,rx,ry,rz,s) => new THREE.Matrix4().compose(

  new THREE.Quaternion().setFromEuler(new THREE.Euler(rx||0,ry||0,rz||0)),
  new THREE.Vector3(1,1,1).multiplyScalar(s===undefined?1:s));

const UW = { t:{value:0}, amp:{value:.1}, h:{value:2.1} };
function windMat(){
  const m = new THREE.MeshLambertMaterial({ vertexColors:true });
  gouache(m, .3, true);
  chainCompile(m, s => {
    s.uniforms.uTime = UW.t; s.uniforms.uAmp = UW.amp; s.uniforms.uH = UW.h;
    s.vertexShader = 'uniform float uTime;uniform float uAmp;uniform float uH;\n' + s.vertexShader
      .replace('#include <begin_vertex>', `
        #include <begin_vertex>
        vec3 wp = instanceMatrix[3].xyz;
        float seed = fract(sin(dot(wp.xz, vec2(12.9898,78.233)))*43758.5453);
        float ph = wp.x*.55 + wp.z*.75 + seed*6.2831;
        float sway = sin(uTime*1.7 + ph)*.6 + sin(uTime*2.9 + ph*1.7)*.4;
        float gust = .55 + .45*sin(uTime*.42 + wp.x*.07 + wp.z*.03);
        float k = pow(clamp(transformed.y/uH,0.,1.), 1.7);
        float a = uAmp*(.7+seed*.6)*gust*k;
        vec3 W = vec3(sway*a, 0., sway*a*.45);
        vec3 ix = instanceMatrix[0].xyz, iz = instanceMatrix[2].xyz;
        transformed.x += dot(W, ix)/max(dot(ix,ix),1e-4);
        transformed.z += dot(W, iz)/max(dot(iz,iz),1e-4);
      `);
  });
  return m;
}

function tuftRape(flower, stemCol){                         // colza : tiges ramifiées, tête en grappe

function tuftCorn(leaf, stemCol, cob){                      // maïs : des cannes hautes, feuilles en hélice
  // Un vrai champ de maïs, où les cannes se touchent. Six cannes par pied au lieu de trois,
  // écartées jusqu'à trente centimètres du centre : les pieds voisins étant à soixante-douze
  // centimètres, les feuilles d'un pied entrent dans celles d'à côté et la terre disparaît
  // sous le rang. Onze cannes et demie au mètre carré, sans un objet de plus à afficher —
  // c'est une seule géométrie posée aux mêmes emplacements.
  const p = [], H = 2.75;

                   [-.30,-.16,.95], [.22,.28,.90] ];          // décalage x, z, échelle

    p.push({ g, c:stemCol, m:MX(dx,0,dz) });

      p.push({ g:new THREE.ConeGeometry(.12,1.02,3), c:leaf,

function tuftStraw(){

  const p = [], col = '#f7e598', colD = '#cfae52', colP = '#e8d178';

}

const TRACKS = (function(){
  const c = document.createElement('canvas'); c.width = 64; c.height = 32;
  const x = c.getContext('2d');
  const grd = x.createLinearGradient(0,0,64,0);
  grd.addColorStop(0,'rgba(0,0,0,0)'); grd.addColorStop(.3,'rgba(0,0,0,.9)');
  grd.addColorStop(.7,'rgba(0,0,0,.9)'); grd.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle = grd; x.fillRect(0,0,64,32);
  x.globalCompositeOperation = 'destination-out';
  for(let i=0;i<8;i++) x.fillRect(0, i*4, 64, 1.6);
  const tex = new THREE.CanvasTexture(c);
  const MAX = 300, LIFE = 5.5;
  const geo = new THREE.PlaneGeometry(1,1); geo.rotateX(-Math.PI/2);
  const mesh = new THREE.InstancedMesh(geo,
    new THREE.MeshBasicMaterial({ map:tex, color:0x2c5c1a, transparent:true, opacity:.5, depthWrite:false }), MAX);
  mesh.frustumCulled = false; mesh.renderOrder = 1; scene.add(mesh);
  const life = new Float32Array(MAX), px = new Float32Array(MAX), pz = new Float32Array(MAX),
        pa = new Float32Array(MAX), pw = new Float32Array(MAX);
  let head = 0;
  const d = new THREE.Object3D();
  for(let i=0;i<MAX;i++){ d.scale.set(0,0,0); d.updateMatrix(); mesh.setMatrixAt(i,d.matrix); }
  return {
    add(x,z,ang,w){ life[head]=LIFE; px[head]=x; pz[head]=z; pa[head]=ang; pw[head]=w; head=(head+1)%MAX; },
    update(dt){
      let any = false;
      for(let i=0;i<MAX;i++){
        if (life[i] <= 0) continue;
        life[i] -= dt; any = true;
        const f = Math.max(0, Math.min(1, life[i]/LIFE));
        d.position.set(px[i], parcelY(px[i],pz[i]) + .05, pz[i]); d.rotation.set(0,pa[i],0);
        d.scale.set(pw[i]*f, 1, .55); d.updateMatrix();
        mesh.setMatrixAt(i, d.matrix);
      }
      if (any) mesh.instanceMatrix.needsUpdate = true;
    }
  };
})();

const _ray = new THREE.Raycaster(), _ndc = new THREE.Vector2(),

function screenToWorld(cx, cy){

// ---------- tracés : un par engin, et il s'efface derrière ----------
// Chaque engin porte son propre parcours. Le ruban n'est dessiné qu'à partir du point
// courant : ce qui a été parcouru disparaît de lui-même, on voit toujours ce qui reste.
const TRMAX = 700;
function traceKit(v){
  if (v.trace) return v.trace;
  const pos = new Float32Array(TRMAX*6), idx = new Uint32Array((TRMAX-1)*6);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3).setUsage(THREE.DynamicDrawUsage));
  geo.setIndex(new THREE.BufferAttribute(idx,1));
  geo.setDrawRange(0,0);
  // posé sur la terre, test de profondeur actif : l'engin qui roule dessus passe devant
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    color:'#fff0a8', transparent:true, opacity:.26, side:THREE.DoubleSide,
    depthTest:true, depthWrite:false }));
  mesh.frustumCulled = false; mesh.visible = false; scene.add(mesh);
  v.trace = { mesh, geo, pos, idx };
  return v.trace;
}
function traceDraw(v){
  const t = traceKit(v), W = Math.max(1.6, toolW(v));

  if (n < 2){ t.geo.setDrawRange(0,0); t.mesh.visible = false; return; }
  for(let i=0;i<n;i++){
    const a = pts[h+Math.max(0,i-1)], b = pts[h+Math.min(n-1,i+1)];
    let dx = b.x-a.x, dz = b.z-a.z;
    const m = Math.hypot(dx,dz) || 1; dx/=m; dz/=m;
    const px = -dz*W/2, pz = dx*W/2;                 // normale au tracé
    const o = i*6, x = pts[h+i].x, z = pts[h+i].z, y = parcelY(x,z) + .045;
    t.pos[o]   = x+px; t.pos[o+1] = y; t.pos[o+2] = z+pz;
    t.pos[o+3] = x-px; t.pos[o+4] = y; t.pos[o+5] = z-pz;
  }
  for(let i=0;i<n-1;i++){
    const a = i*2, b = a+1, c = a+2, d = a+3, q = i*6;
    t.idx[q]=a; t.idx[q+1]=b; t.idx[q+2]=c; t.idx[q+3]=b; t.idx[q+4]=d; t.idx[q+5]=c;
  }

  t.geo.setDrawRange(0, (n-1)*6);
  t.mesh.visible = true;
}
function traceAdd(v, p){
  if (!v) return;
  if (!v.path){ v.path = []; v.head = 0; }
  const last = v.path[v.path.length-1];
  if (!last || Math.hypot(p.x-last.x, p.z-last.z) > 1.1){
    if (v.path.length - v.head < TRMAX) v.path.push(p);
    traceDraw(v);
  }
}
function traceClear(v){
  if (!v) return;
  v.path = []; v.head = 0; v.accroche = false;
  if (v.trace){ v.trace.geo.setDrawRange(0,0); v.trace.mesh.visible = false; }
}
function traceLeft(v){ return v && v.path ? Math.max(0, v.path.length - v.head) : 0; }
// Le suivi visait le point suivant, à un mètre devant. L'évitement, borné à la distance du
// but, ne voyait donc rien venir : l'engin entrait dans la grange et forçait dessus. Il vise
// maintenant un point pris plus loin sur le tracé — assez loin pour anticiper, ce qui lisse
// aussi la trajectoire — et l'évitement travaille à pleine portée.
function followPath(v, dt){
  let avance = false;
  // Le tracteur suit la ligne et l'outil la suit derrière lui : en cours de route c'est
  // donc bien le tracteur qui consomme les points. Le dernier, en revanche, c'est l'outil
  // qui doit l'atteindre — c'est là que le joueur a voulu que l'effet s'arrête.
  while (v.head < v.path.length){
    const der = v.head === v.path.length - 1;
    const P = der ? outilXZ(v, _out) : v.pos;
    if (Math.hypot(v.path[v.head].x-P.x, v.path[v.head].z-P.z) >= 2.6) break;
    v.head++; avance = true;
  }
  // On rejoint le tracé où on le touche. Le joueur commence rarement son trait pile sur
  // l'engin : le premier point tombait souvent derrière lui, à cinq ou six mètres, hors de
  // portée du rayon de capture — l'engin tournait alors en rond à côté de sa ligne sans
  // jamais l'accrocher. On avance donc jusqu'au point le plus proche devant, jamais en
  // arrière : ce qui reste du tracé est bien ce qu'il reste à faire.
  // (on ne regarde qu'une douzaine de points devant : de quoi glisser le long de la ligne
  //  sans qu'une boucle dessinée puisse se faire couper d'un bout à l'autre)
  if (v.head < v.path.length - 1){
    const t0 = v.head;
    const d0 = Math.hypot(v.path[t0].x-v.pos.x, v.path[t0].z-v.pos.z);
    let j = t0, best = d0;
    const fin = Math.min(v.path.length, t0 + 12);
    for(let k = t0+1; k < fin; k++){
      const d = Math.hypot(v.path[k].x-v.pos.x, v.path[k].z-v.pos.z);
      if (d < best){ best = d; j = k; }
    }
    if (j > t0 && best < d0 - 1){ v.head = j; avance = true; }
  }
  if (v.head >= v.path.length){
    traceClear(v); if (v === pilote()) setPathState('pret');
    return;
  }
  if (v.head > 80){ v.path.splice(0, v.head); v.head = 0; avance = true; }
  if (avance) traceDraw(v);
  // Choix du point visé. L'ancienne règle — avancer tant que le point est à moins de LOOK
  // de l'engin — basculait d'un coup : à quelques centimètres près, la consigne sautait du
  // premier point du tracé à un point bien plus loin, souvent dans une autre direction.
  // L'engin partait alors tourner en rond sans jamais accrocher la ligne. On sépare donc
  // les deux cas : tant qu'on n'est pas sur le tracé, on va droit sur son premier point ;
  // une fois dessus, on avance LE LONG du tracé, ce qui ne peut plus revenir en arrière.
  const LOOK = Math.max(6.5, v.speed*.85);
  const dTete = Math.hypot(v.path[v.head].x-v.pos.x, v.path[v.head].z-v.pos.z);
  let i = v.head;
  if (dTete < LOOK){
    let reste = LOOK - dTete;
    while (i < v.path.length-1 && reste > 0){
      reste -= Math.hypot(v.path[i+1].x-v.path[i].x, v.path[i+1].z-v.path[i].z);
      i++;
    }
  }
  // et jamais un point posé sur le capot : viser à bout portant fait tourner l'engin en
  // rond au lieu de l'amener sur la ligne
  const MINI = RMIN*2 + 1.2;
  while (i < v.path.length-1 &&
         Math.hypot(v.path[i].x-v.pos.x, v.path[i].z-v.pos.z) < MINI) i++;
  // coincé pour de bon : on abandonne le point courant plutôt que d'insister
  v.bloque = v.speed < 1.2 ? (v.bloque || 0) + dt : 0;
  if (v.bloque > 2.5){ v.bloque = 0; v.head++; traceDraw(v); return; }
  // sur le tout dernier point seulement, on vise avec l'outil : l'engin dépasse le bout du
  // tracé de la longueur de son attelage, pour que l'outil, lui, s'arrête pile dessus
  v.__cible = v.path[i];
  driveTo(v, v.path[i], dt, false, true, i === v.path.length-1);
}

// Un champ de particules instancié : position, vitesse, gravité et culbute.
// Elles retombent sur la terre — dont la hauteur varie — et s'y posent avant de disparaître.
function particleField(n, geo, color, g, spin){
  const mesh = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color }), n);
  mesh.frustumCulled = false; mesh.castShadow = false; scene.add(mesh);
  const P = [], d = new THREE.Object3D();
  for(let i=0;i<n;i++){
    P.push({ t:-1, x:0,y:0,z:0, vx:0,vy:0,vz:0, s:1, rx:0,ry:0,rz:0, wx:0,wy:0,wz:0, life:1 });
    d.scale.set(0,0,0); d.updateMatrix(); mesh.setMatrixAt(i, d.matrix);
  }
  let head = 0;
  return {
    spawn(x,y,z, vx,vy,vz, life, sc){
      const p = P[head]; head = (head+1)%n;
      p.t = 0; p.life = life; p.x = x; p.y = y; p.z = z;
      p.vx = vx; p.vy = vy; p.vz = vz; p.s = sc;
      p.rx = Math.random()*6.28; p.ry = Math.random()*6.28; p.rz = Math.random()*6.28;
      p.wx = (Math.random()-.5)*spin; p.wy = (Math.random()-.5)*spin; p.wz = (Math.random()-.5)*spin;
    },
    update(dt){
      let any = false;
      for(let i=0;i<n;i++){
        const p = P[i]; if (p.t < 0) continue;
        any = true; p.t += dt;
        if (p.t > p.life){ p.t = -1; d.scale.set(0,0,0); d.updateMatrix(); mesh.setMatrixAt(i,d.matrix); continue; }
        p.vy -= g*dt;
        p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
        const sol = parcelY(p.x, p.z) + .035;
        if (p.y <= sol){                       // elle touche : elle roule un peu puis s'immobilise
          p.y = sol; p.vy = -p.vy*.18; p.vx *= .42; p.vz *= .42;
          if (Math.abs(p.vy) < .35) p.vy = 0;
          p.wx *= .3; p.wy *= .3; p.wz *= .3;
        } else {
          p.rx += p.wx*dt; p.ry += p.wy*dt; p.rz += p.wz*dt;
        }
        d.position.set(p.x, p.y, p.z);
        d.rotation.set(p.rx, p.ry, p.rz);
        d.scale.setScalar(p.s * Math.min(1, (p.life-p.t)*5));
        d.updateMatrix(); mesh.setMatrixAt(i, d.matrix);
      }
      if (any) mesh.instanceMatrix.needsUpdate = true;
    },
    live(){ let n = 0; for(let i=0;i<P.length;i++) if (P[i].t >= 0) n++; return n; }
  };
}

// Un seul disque au milieu du tracteur laissait passer tout le reste : l'outil traîné, la
// coupe de la moissonneuse, la caisse de la benne entraient dans les murs pendant que le
// centre, lui, passait à côté. À l'écran l'engin forçait dans le bâtiment. Chaque engin
// porte donc plusieurs disques répartis sur sa longueur — décalage vers l'avant, rayon.
const CORPS = {
  prep:    [[ .4,1.8], [-3.2,2.3]],
  sow:     [[ .4,1.8], [-3.2,2.3]],
  fert:    [[ .4,1.8], [-3.2,2.6]],          // rampes larges
  harvest: [[3.0,2.7], [0,2.3], [-2.4,2.0]], // coupe devant, corps, arrière
  trailer: [[2.4,1.8], [-2.6,2.2]]           // tracteur puis caisse

function vehicle(kind){
  brakeLights = []; headlamps = []; beacons = [];

  h.updateMatrixWorld(true);

           sus:0, susV:0, pit:0, pitV:0, rol:0, rolV:0, lastS:0, wph:Math.random()*6,
           sq:0, sqV:0, line:0, strk:0,
           corps: CORPS[kind] || CORPS.prep,
           rad: Math.max.apply(null, (CORPS[kind]||CORPS.prep).map(c=>c[1])),

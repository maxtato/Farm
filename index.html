<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3f8a22">
<meta name="description" content="Déchaume, sème, fertilise, moissonne : conduis toute la saison et fais tourner l'exploitation.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Ferme — cycle complet</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --soil:#3d2b17; --soilD:#2a1d0f;
    --bark:#25341a; --barkL:#374a26; --barkE:#4d6733;
    --cream:#fff5e0; --creamD:#f2e2bd; --ink:#42301a; --inkSoft:#7a6440;
    --gold:#ffc93c; --goldD:#c07f0c;
    --grass:#4cb44e; --grassD:#2d7a2f;
    --rust:#e2593f; --rustD:#a83422;
    --sky:#4fa9de; --skyD:#2b7cad;
    --plum:#a374de; --plumD:#6f43a8;
    /* tout le chrome se mesure en hauteur d'écran : sur un petit téléphone,
       des tailles fixes ne laissaient qu'un tiers de l'écran au jeu */
    --sd:clamp(21px, 3.1vh, 26px);      /* diamètre d'une étape */
    --gap:clamp(4px, .8vh, 7px);
    --fsm:clamp(9.5px, 1.5vh, 11.5px);  /* petit texte */
  }

  html,body { height:100%; overflow:hidden; background:var(--bark); }
  body { font-family:-apple-system,"Segoe UI Rounded","Segoe UI",system-ui,sans-serif; font-weight:800;
         touch-action:none; user-select:none; color:var(--cream); }

  /* ---------- ossature : bandeaux pleins, scène au milieu ---------- */
  #ui { position:fixed; inset:0; display:flex; flex-direction:column; }
  #stage { position:relative; flex:1 1 auto; min-height:0; overflow:hidden; background:#54a52e;
           touch-action:none; }
  #app { position:absolute; inset:0; }
  canvas { display:block; }

  #top, #bot { flex:0 0 auto; position:relative; z-index:2;
               background:linear-gradient(180deg, var(--barkL), var(--bark)); }
  /* sur grand écran, le contenu des bandeaux reste groupé au centre */
  #top > *, #bot > * { width:100%; max-width:580px; margin-left:auto; margin-right:auto; }
  #top { padding:calc(env(safe-area-inset-top) + var(--gap)) 10px var(--gap);
         box-shadow:0 5px 0 rgba(0,0,0,.28), 0 14px 22px rgba(0,0,0,.3); }
  #top::after, #bot::before { content:''; position:absolute; left:0; right:0; height:4px;
         background:repeating-linear-gradient(90deg, var(--barkE) 0 14px, #5d7b3d 14px 28px); }
  #top::after { bottom:0; }
  #bot::before { top:0; }
  #bot { padding:var(--gap) 9px calc(min(env(safe-area-inset-bottom), 8px) + 3px);
         box-shadow:0 -5px 0 rgba(0,0,0,.28), 0 -14px 22px rgba(0,0,0,.3);
         display:flex; flex-direction:column; gap:var(--gap); }

  /* ---------- pastilles d'info ---------- */
  /* les pastilles se dimensionnent sur leur contenu : à quatre sur 360 px de large,
     une largeur égale les tronquait toutes */
  .chips { display:flex; gap:5px; justify-content:space-between; }
  .chip { flex:0 1 auto; min-width:0; display:flex; align-items:center; gap:5px;
          background:var(--cream); color:var(--ink); border-radius:999px;
          padding:3px 9px 3px 3px; box-shadow:0 3px 0 rgba(0,0,0,.34); }
  .chip .tok { flex:0 0 auto; width:clamp(20px, min(4vh, 7vw), 30px); aspect-ratio:1; border-radius:50%;
               display:grid; place-items:center; font-size:clamp(11px, min(2vh, 3.6vw), 15px);
               background:var(--goldD); box-shadow:inset 0 -2px 0 rgba(0,0,0,.22); }
  .chip b { font-size:clamp(10.5px, min(1.9vh, 3.5vw), 14px); font-weight:900;
            letter-spacing:-.3px; white-space:nowrap; }
  .chip em { font-style:normal; font-size:.78em; opacity:.62; margin-left:-2px; }
  .chip.c-wheat .tok { background:#e2a92c; }
  .chip.c-sky   .tok { background:var(--skyD); }
  .chip.c-lvl   .tok { background:var(--plumD); }
  .chip.pop { animation:pop .34s cubic-bezier(.2,1.5,.4,1); }
  @keyframes pop { 0%{transform:scale(1)} 40%{transform:scale(1.16)} 100%{transform:scale(1)} }

  /* ---------- suivi du cycle ---------- */
  #steps { display:flex; align-items:flex-start; margin-top:var(--gap); }
  .step { flex:1 1 0; display:flex; flex-direction:column; align-items:center; gap:2px;
          position:relative; opacity:.5; pointer-events:auto; background:none; border:none;
          padding:0; font:inherit; color:inherit; }
  .step:focus-visible { outline:3px solid var(--gold); outline-offset:3px; border-radius:10px; }
  .step::before { content:''; position:absolute; top:calc(var(--sd)/2 - 2px); left:-50%; width:100%; height:5px;
                  background:rgba(0,0,0,.3); border-radius:3px; z-index:0; }
  .step:first-child::before { display:none; }
  .step.done::before, .step.on::before { background:var(--gold); }
  .step i { position:relative; z-index:1; width:var(--sd); height:var(--sd); border-radius:50%;
            display:grid; place-items:center; font-size:clamp(12px, 2vh, 15px); font-style:normal;
            background:var(--bark); border:3px solid rgba(0,0,0,.3); }
  .step span { font-size:clamp(7px, 1.15vh, 8.5px); text-transform:uppercase;
               letter-spacing:.3px; white-space:nowrap; }
  .step.done { opacity:.92; }
  .step.done i { background:var(--grassD); border-color:var(--grass); }
  .step.on { opacity:1; }
  .step.on i { background:var(--gold); border-color:#fff0bd; color:var(--ink);
               transform:scale(1.16); animation:beat 1.5s ease-in-out infinite; }
  .step.on span { color:var(--gold); }
  @keyframes beat { 0%,100%{transform:scale(1.16)} 50%{transform:scale(1.28)} }

  /* ---------- contrat ---------- */
  #contract { display:none; margin-top:var(--gap); background:rgba(0,0,0,.3); border-radius:12px;
              padding:4px 10px 5px; font-size:var(--fsm); }
  #contract.on { display:block; }
  #contract .hd { display:flex; align-items:center; gap:6px; }
  #contract .hd b { color:var(--gold); }
  #contract .hd .sp { flex:1; }
  #contract .bar { height:6px; border-radius:4px; background:rgba(0,0,0,.42); margin-top:3px;
                   overflow:hidden; box-shadow:inset 0 2px 0 rgba(0,0,0,.25); }
  #contract .bar i { display:block; height:100%; border-radius:5px; width:0;
                     background:linear-gradient(180deg,#ffe07a,var(--gold));
                     transition:width .3s ease-out; }

  /* ---------- bandeau bas ---------- */
  #gaugerow { margin-top:var(--gap); }
  #gauge { width:100%; height:clamp(17px, 2.5vh, 21px); border-radius:999px; background:rgba(0,0,0,.4);
           box-shadow:inset 0 2px 0 rgba(0,0,0,.3); position:relative; overflow:hidden; }
  #gauge i { position:absolute; inset:2px auto 2px 2px; width:0; border-radius:999px;
             background:linear-gradient(180deg,#8fe36a,var(--grassD)); transition:width .2s linear; }
  #gauge.full i { background:linear-gradient(180deg,#ffb36a,var(--rustD)); }
  #gauge.full { animation:beat2 .8s ease-in-out infinite; }
  @keyframes beat2 { 0%,100%{transform:scale(1)} 50%{transform:scale(1.045)} }
  #gauge span { position:absolute; inset:0; display:grid; place-items:center; font-size:clamp(9.5px, 1.5vh, 11px);
                font-weight:900; text-shadow:0 1px 2px rgba(0,0,0,.6); }

  /* deux gros boutons, et tout le reste en pastilles de coin : le bandeau respire */
  #mainrow { display:flex; gap:9px; }
  .big { flex:1 1 0; min-width:0; background:var(--cream); color:var(--ink); border:none;
         border-radius:16px; padding:clamp(6px,1vh,10px) 8px; font-family:inherit; font-weight:900;
         font-size:clamp(11px,1.7vh,13.5px); line-height:1.15; display:flex; align-items:center;
         justify-content:center; gap:8px; box-shadow:0 4px 0 var(--creamD), 0 6px 10px rgba(0,0,0,.28);
         transition:transform .06s; }
  .big i { font-style:normal; font-size:clamp(17px,2.9vh,22px); line-height:1; }
  .big span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .big .sw { flex:0 0 auto; font-size:clamp(13px,2.1vh,16px); opacity:.42; margin-left:-2px; }
  .big:active { transform:translateY(3px); box-shadow:0 1px 0 var(--creamD); }
  .big:disabled { opacity:.5; box-shadow:0 4px 0 var(--creamD); }
  #vehBtn.alt { background:linear-gradient(180deg,#ffdd77,var(--gold));
                box-shadow:0 4px 0 var(--goldD), 0 6px 10px rgba(0,0,0,.28); }

  #padrow { display:flex; align-items:center; gap:8px; }
  #padrow #pad { flex:1 1 auto; }
  .corner { flex:0 0 auto; display:flex; flex-direction:column; gap:7px; }
  .mini { width:clamp(38px,5.6vh,46px); aspect-ratio:1; border-radius:50%; border:none; padding:0;
          background:rgba(0,0,0,.34); color:var(--cream); font-family:inherit; font-weight:900;
          font-size:clamp(15px,2.4vh,18px); display:grid; place-items:center;
          box-shadow:inset 0 0 0 2px rgba(255,255,255,.14); transition:transform .06s; }
  .mini:active { transform:scale(.92); }
  .mini:focus-visible { outline:3px solid var(--gold); outline-offset:2px; }
  .mini.on { background:linear-gradient(180deg,#ffdd77,var(--gold)); color:var(--ink);
             box-shadow:0 3px 0 var(--goldD); }

  /* ---------- boutons épais ---------- */
  .btn { flex:1 1 0; min-width:0; background:var(--cream); color:var(--ink); border:none;
         border-radius:14px; padding:clamp(5px,.9vh,7px) 5px clamp(6px,1vh,8px);
         font-family:inherit; font-weight:900;
         font-size:var(--fsm); line-height:1.15; box-shadow:0 4px 0 var(--creamD), 0 6px 8px rgba(0,0,0,.28);
         display:flex; flex-direction:column; align-items:center; gap:2px; transition:transform .06s; }
  .btn i { font-style:normal; font-size:clamp(13px, 2.2vh, 16px); line-height:1; }
  /* écran court : la rangée de réglages passe en icônes seules */
  @media (max-height: 720px){ .actrow.tools .btn span { display:none; }
                              .actrow.tools .btn.keep span { display:block; } }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 var(--creamD); }
  .btn.on { background:linear-gradient(180deg,#ffdd77,var(--gold)); box-shadow:0 4px 0 var(--goldD), 0 6px 8px rgba(0,0,0,.28); }
  .btn.dark { background:var(--barkL); color:var(--cream); box-shadow:0 4px 0 rgba(0,0,0,.42); }
  .btn.wide { flex:2 1 0; }

  /* repère de zoom : sans retour visible, on ne sait pas qu'on pince */
  #zoomTag { position:fixed; z-index:9; left:50%; transform:translateX(-50%) scale(.9);
             top:calc(env(safe-area-inset-top) + 168px);
             background:rgba(14,20,14,.82); color:var(--cream); border-radius:999px;
             padding:6px 15px; font-size:13px; font-weight:900;
             font-variant-numeric:tabular-nums; opacity:0; pointer-events:none;
             transition:opacity .18s ease, transform .18s ease; }
  #zoomTag.on { opacity:1; transform:translateX(-50%) scale(1); }

  /* ---------- effets volants ---------- */
  #fx { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:6; }
  .float { position:absolute; display:flex; align-items:center; gap:6px; color:#fff; font-size:21px;
           font-weight:900; text-shadow:0 3px 0 rgba(0,0,0,.45); white-space:nowrap;
           transform:translate(-50%,-50%); will-change:transform,opacity; }
  .float .c { width:24px; height:24px; border-radius:50%;
              background:radial-gradient(circle at 34% 30%, #ffe38a, #e39b1c); border:2px solid #a86c07; }
  .fly { position:absolute; width:19px; height:19px; border-radius:50%; margin:-9px 0 0 -9px;
         background:radial-gradient(circle at 34% 30%, #ffe38a, #e39b1c); border:2px solid #a86c07;
         box-shadow:0 2px 5px rgba(0,0,0,.35); will-change:transform,opacity; }
  .conf { position:absolute; width:9px; height:14px; border-radius:2px; will-change:transform,opacity; }

  /* ---------- messages ---------- */
  #toast { position:fixed; z-index:20; left:50%; transform:translateX(-50%); top:23%;
           display:flex; flex-direction:column; align-items:center; gap:7px; pointer-events:none; }
  #toast div { background:var(--cream); color:var(--ink); border-radius:14px; padding:9px 16px;
               font-size:13px; font-weight:900; box-shadow:0 5px 0 rgba(0,0,0,.3);
               animation:tin .34s cubic-bezier(.2,1.4,.4,1); }
  #toast div.bad  { background:var(--rust); color:#fff; box-shadow:0 5px 0 var(--rustD); }
  #toast div.good { background:var(--grass); color:#fff; box-shadow:0 5px 0 var(--grassD); }
  @keyframes tin { from { opacity:0; transform:translateY(14px) scale(.9); } }

  /* ---------- manette ---------- */
  #pad { display:flex; justify-content:center; }
  #pathBtn svg{ width:52%; height:52%; }
  #pathBtn{ opacity:.45; }                       /* rien à arrêter : le bouton s'efface */
  #pathBtn.rolling{ opacity:1; background:linear-gradient(180deg,#ff8a72,var(--rust));
                    color:#fff; box-shadow:0 3px 0 var(--rustD); }
  #btnCam.free{ background:linear-gradient(180deg,#ffdd77,var(--gold)); color:var(--ink);
                box-shadow:0 3px 0 var(--goldD); }
  #padStick { display:flex; width:100%; justify-content:center; }
  body.kb #padStick { display:none; }
  @keyframes armPulse{ 0%,100%{ box-shadow:0 3px 0 var(--goldD), 0 0 0 0 rgba(255,201,60,.55); }
                       50%{ box-shadow:0 3px 0 var(--goldD), 0 0 0 10px rgba(255,201,60,0); } }
  @media (prefers-reduced-motion:reduce){ #pathBtn.armed{ animation:none; } }
  #stick { position:relative; width:clamp(78px, 13vh, 108px); aspect-ratio:1; border-radius:50%;
           background:radial-gradient(circle at 50% 38%, rgba(0,0,0,.28), rgba(0,0,0,.46));
           border:4px solid rgba(255,255,255,.22); touch-action:none;
           box-shadow:inset 0 4px 10px rgba(0,0,0,.4); }
  #knob { position:absolute; left:26%; top:26%; width:48%; height:48%;
          border-radius:50%; background:linear-gradient(180deg,#ffdd77,var(--gold));
          border:3px solid rgba(0,0,0,.32); box-shadow:0 4px 0 var(--goldD); }

  /* ---------- fenêtres ---------- */
  #ovl { position:fixed; inset:0; z-index:30; background:rgba(12,20,10,.68); display:none;
         align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(2px); }
  #ovl.on { display:flex; }
  #sheet { width:100%; max-width:430px; max-height:88vh; display:flex; flex-direction:column;
           background:var(--cream); color:var(--ink); border:4px solid #fff; border-radius:26px;
           box-shadow:0 12px 0 rgba(0,0,0,.32), 0 24px 44px rgba(0,0,0,.42); overflow:hidden;
           animation:sheetIn .3s cubic-bezier(.2,1.35,.4,1); }
  @keyframes sheetIn { from { opacity:0; transform:scale(.86) translateY(18px); } }
  #sheetHead { position:relative; display:flex; align-items:center; gap:10px; padding:13px 16px 12px;
               background:linear-gradient(180deg,#ffdd77,var(--gold)); color:var(--ink);
               font-size:19px; font-weight:900; box-shadow:0 3px 0 rgba(0,0,0,.14); }
  #sheetHead .sp { flex:1; }
  #sheetX { flex:0 0 auto; width:34px; height:34px; border-radius:50%; border:none; font-size:16px;
            font-family:inherit; font-weight:900; background:var(--rust); color:#fff;
            box-shadow:0 3px 0 var(--rustD); display:grid; place-items:center; }
  #sheetX:active { transform:translateY(2px); box-shadow:0 1px 0 var(--rustD); }
  #tabs { display:flex; gap:6px; padding:11px 14px 4px; }
  #tabs .tab { flex:1 1 0; border:none; border-radius:13px; padding:9px 4px; font-family:inherit;
               font-weight:900; font-size:11.5px; background:var(--creamD); color:var(--inkSoft);
               box-shadow:0 3px 0 rgba(0,0,0,.14); }
  #tabs .tab.on { background:var(--ink); color:var(--cream); box-shadow:0 3px 0 rgba(0,0,0,.3); }
  #body { overflow-y:auto; padding:10px 14px 18px; -webkit-overflow-scrolling:touch; }

  .card { background:#fff; border-radius:18px; padding:11px; margin-bottom:9px;
          display:flex; align-items:center; gap:11px; box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .card .ic { flex:0 0 auto; width:46px; height:46px; border-radius:14px; display:grid; place-items:center;
              font-size:24px; background:var(--creamD); box-shadow:inset 0 -3px 0 rgba(0,0,0,.1); }
  .card .tx { flex:1; min-width:0; }
  .card .tx b { display:block; font-size:14.5px; }
  .card .tx span { display:block; font-size:11px; color:var(--inkSoft); margin-top:2px; line-height:1.35; }
  .card .lv { display:flex; gap:3px; margin-top:6px; }
  .card .lv i { width:16px; height:7px; border-radius:4px; background:var(--creamD); }
  .card .lv i.f { background:var(--gold); box-shadow:inset 0 -1px 0 rgba(0,0,0,.15); }
  .card.sel { background:linear-gradient(180deg,#fff8e2,#ffeeba); box-shadow:0 0 0 3px var(--gold), 0 3px 0 rgba(0,0,0,.12); }
  .card.sel .ic { background:var(--gold); }

  .buy { flex:0 0 auto; border:none; border-radius:13px; padding:10px 12px; font-family:inherit;
         font-weight:900; font-size:12px; white-space:nowrap; color:#fff;
         background:linear-gradient(180deg,#6bd06d,var(--grass)); box-shadow:0 4px 0 var(--grassD); }
  .buy:active { transform:translateY(3px); box-shadow:0 1px 0 var(--grassD); }
  .buy:disabled { background:var(--creamD); color:#b3a184; box-shadow:0 4px 0 #ddcaa4; }
  .buy.max { background:var(--creamD); color:var(--inkSoft); box-shadow:0 4px 0 #ddcaa4; }
  .buy.gold { background:linear-gradient(180deg,#ffdd77,var(--gold)); color:var(--ink); box-shadow:0 4px 0 var(--goldD); }

  .note { color:var(--inkSoft); font-size:12px; line-height:1.55; font-weight:700; margin:2px 2px 11px; }
  .note b { color:var(--ink); }
  .keys { display:grid; grid-template-columns:auto 1fr; gap:7px 11px; align-items:center;
          font-size:12.5px; background:#fff; border-radius:18px; padding:13px;
          box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .keys kbd { background:var(--ink); color:var(--cream); border-radius:8px; padding:5px 8px;
              font-family:inherit; font-size:11px; white-space:nowrap; text-align:center;
              box-shadow:0 2px 0 rgba(0,0,0,.35); }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:11px; }
  .stats div { background:#fff; border-radius:16px; padding:10px 12px; box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .stats b { display:block; font-size:18px; }
  .stats span { font-size:11px; color:var(--inkSoft); }

  /* passage de niveau */
  #sheet.party { border-color:var(--gold); }
  .party-head { background:linear-gradient(180deg,var(--plum),var(--plumD)) !important; color:#fff !important; }
  .prize { text-align:center; background:#fff; border-radius:20px; padding:20px 14px;
           box-shadow:0 3px 0 rgba(0,0,0,.12); margin-bottom:11px; }
  .prize .big { display:flex; align-items:center; justify-content:center; gap:11px;
                font-size:40px; font-weight:900; letter-spacing:-1px; }
  .prize .big .c { width:44px; height:44px; border-radius:50%;
                   background:radial-gradient(circle at 34% 30%, #ffe38a, #e39b1c); border:3px solid #a86c07; }
  .prize p { color:var(--inkSoft); font-size:12.5px; margin-top:7px; }
  .full-btn { width:100%; padding:14px; font-size:15px; border-radius:16px; }
</style>
</head>
<body>
<div id="ui">
  <header id="top">
    <div class="chips">
      <div class="chip c-gold" id="chipCoins"><span class="tok">🪙</span><b id="coins">0</b></div>
      <div class="chip c-wheat"><span class="tok">🌾</span><b id="stock">0</b><em>t</em></div>
      <div class="chip c-sky"><span class="tok" id="wIcon">☀️</span><b id="clock">08:00</b></div>
      <div class="chip c-lvl" id="chipLvl"><span class="tok">⭐</span><b id="lvl">1</b></div>
    </div>
    <div id="steps"></div>
    <div id="gaugerow">
      <div id="gauge"><i></i><span id="gval">0 %</span></div>
    </div>
    <div id="contract"></div>
  </header>

  <div id="stage"><div id="app"></div></div>

  <footer id="bot">
    <div id="mainrow">
      <button class="big" id="vehBtn"><i>🌾</i><span>Moissonneuse</span></button>
      <button class="big" id="cropBtn"><i>🌾</i><span>Blé</span></button>
    </div>
    <div id="padrow">
      <div class="corner">
        <button class="mini" id="btnShop" aria-label="Boutique">🛒</button>
        <button class="mini" id="pathBtn" aria-label="Arrêter l'engin">
          <svg id="icoStop" viewBox="0 0 44 44" aria-hidden="true">
            <rect x="13" y="13" width="18" height="18" rx="3" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div id="pad">
        <div id="padStick"><div id="stick"><div id="knob"></div></div></div>
      </div>
      <div class="corner">
        <button class="mini" id="btnCam" aria-label="Recentrer sur l'engin">🎯</button>
        <button class="mini" id="btnHitch" aria-label="Atteler ou décrocher la benne" style="display:none">⚓</button>
        <button class="mini" id="btnSet" aria-label="Réglages">⚙️</button>
      </div>
